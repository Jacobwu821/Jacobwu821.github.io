<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脉络 文献图谱</title>
<meta name="description" content="把读过的文献连成一张图：文献、概念、方法、问题，以及它们之间的关系。">
<meta name="theme-color" content="#090e1a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090e1a'/%3E%3Cpath d='M9 22 16 9l8 9-15 4z' fill='none' stroke='%236fa5ff' stroke-width='1.6'/%3E%3Ccircle cx='9' cy='22' r='3' fill='%233fd3bd'/%3E%3Ccircle cx='16' cy='9' r='3.4' fill='%23ffc247'/%3E%3Ccircle cx='24' cy='18' r='3' fill='%236fa5ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>
<style>
/* Layout idea: a one-screen instrument. Quiet chrome (top bar, filter rail, detail sheet) around one loud thing,
   the graph, drawn like a star chart on a graticule. Paper titles are set in a journal serif. */
:root{
  --bg:#eef1f6; --surface:#f8fafd; --raise:#ffffff; --sunk:#e4e9f1;
  --ink:#131c2b; --ink-2:#465369; --ink-3:#7c889b; --line:#d3dae5; --line-2:#e4e9f1;
  --grid:rgba(19,28,43,.16); --glow:rgba(37,99,217,.07);
  --accent:#eaa300; --accent-ink:#241900; --accent-text:#8f5d00; --accent-soft:rgba(234,163,0,.16);
  --c-paper:#2563d9; --c-concept:#0c8f7f; --c-method:#7a4fe0; --c-question:#cf3d72;
  --good:#1a8f55; --bad:#d23b3b;
  --shadow:0 1px 2px rgba(19,28,43,.06),0 10px 28px rgba(19,28,43,.10);
  --font-display:"Newsreader","Songti SC","Noto Serif SC",Georgia,serif;
  --font-body:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#090e1a; --surface:#0e1525; --raise:#151e33; --sunk:#0a101d;
  --ink:#e9eef8; --ink-2:#a8b4c8; --ink-3:#6c7a92; --line:#243049; --line-2:#1a2439;
  --grid:rgba(160,185,230,.17); --glow:rgba(111,165,255,.09);
  --accent:#ffc247; --accent-ink:#241900; --accent-text:#ffc247; --accent-soft:rgba(255,194,71,.16);
  --c-paper:#6fa5ff; --c-concept:#3fd3bd; --c-method:#ab92ff; --c-question:#ff7daa;
  --good:#4cd08b; --bad:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-body);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.grow{flex:1}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand svg{align-self:center}
.brand-name{font:600 21px/1 var(--font-display);letter-spacing:.04em}
.brand-sub{font:italic 400 14px/1 var(--font-display);color:var(--ink-3)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{position:relative;flex:1;max-width:440px;min-width:120px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid transparent;background:var(--sunk);padding:0 38px 0 36px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--raise)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:500 11px var(--font-mono);color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface)}
.drop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;z-index:60;max-height:320px;overflow:auto}
.drop button{display:flex;width:100%;gap:9px;align-items:center;text-align:left;padding:7px 9px;border-radius:8px}
.drop button:hover,.drop button.act{background:var(--sunk)}
.drop .d-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop .d-m{color:var(--ink-3);font-size:12px;white-space:nowrap}
.drop .d-new{color:var(--accent-text);font-weight:500}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto;position:relative}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:transform .12s,background .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;border-radius:8px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:220px;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;z-index:60}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;text-align:left}
.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 4px}
.menu .danger{color:var(--bad)}
.only-m{display:none}

/* ---------- shell ---------- */
.shell{flex:1;display:flex;min-height:0;position:relative}
.rail{width:272px;flex:none;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:22px}
.rail h3{font:600 11px/1 var(--font-body);letter-spacing:.1em;color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rail h3 button{margin-left:auto;font:500 12px var(--font-body);letter-spacing:0;color:var(--accent-text)}
.stat{display:flex;align-items:flex-end;gap:12px}
.stat-n{font:500 46px/.9 var(--font-display);font-variant-numeric:tabular-nums}
.stat-l{color:var(--ink-2);font-size:13px;padding-bottom:3px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:12px;display:flex}
.bar i{display:block;height:100%}
.stat-row{display:flex;justify-content:space-between;color:var(--ink-2);font-size:12.5px;margin-top:8px}
.stat-row b{color:var(--ink);font-weight:600}
.tog{display:flex;flex-direction:column;gap:2px}
.tog button{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;width:100%;text-align:left}
.tog button:hover{background:var(--sunk)}
.tog button[aria-pressed="false"]{color:var(--ink-3)}
.tog button[aria-pressed="false"] svg{opacity:.35}
.tog .cnt{margin-left:auto;font:400 12px var(--font-mono);color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);background:var(--raise);display:inline-flex;align-items:center;gap:5px}
button.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.chip .cnt{font:400 11px var(--font-mono);color:var(--ink-3)}
.hist{display:flex;align-items:flex-end;gap:2px;height:44px}
.hist i{flex:1;background:var(--line);border-radius:2px 2px 0 0;min-height:3px}
.hist i.in{background:var(--c-paper)}
.dual{position:relative;height:22px;margin-top:2px}
.dual input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none;height:22px}
.dual input::-webkit-slider-runnable-track{height:2px;background:var(--line)}
.dual input::-moz-range-track{height:2px;background:var(--line)}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--raise);border:2px solid var(--c-paper);margin-top:-7px;cursor:grab}
.dual input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--raise);border:2px solid var(--c-paper);cursor:grab}
.yr{display:flex;justify-content:space-between;font:400 12px var(--font-mono);color:var(--ink-2)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.legend svg{display:block}
.muted{color:var(--ink-3);font-size:12.5px}

/* ---------- stage ---------- */
.stage{flex:1;min-width:0;position:relative;overflow:hidden;background:radial-gradient(900px 600px at 55% 40%,var(--glow),transparent 70%),var(--bg)}
.view{position:absolute;inset:0}
#cv{position:absolute;inset:0;touch-action:none;cursor:grab;display:block}
#cv.grabbing{cursor:grabbing}
.float{position:absolute;display:flex;gap:8px;z-index:5}
.float.tl{top:14px;left:14px;flex-wrap:wrap;right:14px;pointer-events:none}
.float.tl>*{pointer-events:auto}
.float.br{right:14px;bottom:14px;flex-direction:column;transition:right .28s}
.stage.has-panel .float.br{right:400px}
.tool{background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:3px;display:flex;gap:2px}
.tool.col{flex-direction:column}
.tool .seg{background:none;padding:0}
.tool .icon-btn{width:32px;height:32px;border-radius:9px}
.tool-btn{height:32px;padding:0 10px;border-radius:9px;display:flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tool-btn:hover{background:var(--sunk);color:var(--ink)}
.tool-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.hint{position:absolute;left:16px;bottom:14px;color:var(--ink-3);font-size:12px;pointer-events:none;z-index:4}
.banner{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:9px 10px 9px 14px;display:flex;align-items:center;gap:10px;z-index:6;max-width:calc(100% - 28px);flex-wrap:wrap}
.banner>span{color:var(--ink-2)}
.stage.has-panel .banner{left:calc(50% - 200px)}
.stage.has-panel .hint{display:none}
.tip{position:absolute;z-index:8;pointer-events:none;width:300px;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:11px 13px}
.tip h4{margin:6px 0 2px;font:500 16px/1.3 var(--font-display);text-wrap:balance}
.tip .meta{color:var(--ink-3);font-size:12px}
.tip p{margin-top:7px;color:var(--ink-2);font-size:13px}
.relpop{position:absolute;z-index:9;width:250px;background:var(--raise);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:11px}
.rp-head{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:9px}
.rp-head b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rp-head b:last-of-type{text-align:right}
.rp-opts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.rp-opts button{padding:6px 8px;border-radius:8px;border:1px solid var(--line);text-align:left;display:flex;align-items:center;gap:7px;font-size:13px}
.rp-opts button:hover{border-color:var(--ink-3)}
.rp-opts button.def{border-color:var(--accent);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
.empty{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}
.empty>div{pointer-events:auto;text-align:center;max-width:360px;padding:24px}
.empty h2{font:500 26px/1.2 var(--font-display);margin-bottom:8px}
.empty p{color:var(--ink-2);margin-bottom:16px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- list ---------- */
#viewList{overflow:auto;padding:18px 20px 40px;background:var(--bg)}
.stage.has-panel #viewList{padding-right:400px}
table.list{width:100%;border-collapse:separate;border-spacing:0;background:var(--raise);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list th{position:sticky;top:0;text-align:left;font:600 11px var(--font-body);letter-spacing:.08em;color:var(--ink-3);padding:11px 12px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.list th.sorted{color:var(--ink)}
.list td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.list tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer}
.list tbody tr:hover td{background:var(--surface)}
.list tbody tr.sel td{background:var(--accent-soft)}
.l-title{font:500 16px/1.3 var(--font-display)}
.l-core{color:var(--ink-2);font-size:12.5px;margin-top:2px;max-width:60ch}
.l-type{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid currentColor;white-space:nowrap}
.pill.todo{color:var(--ink-3)} .pill.read{color:var(--c-paper)} .pill.deep{color:var(--good)}
.t-paper{color:var(--c-paper)} .t-concept{color:var(--c-concept)} .t-method{color:var(--c-method)} .t-question{color:var(--c-question)}

/* ---------- detail panel ---------- */
.panel{position:absolute;left:0;top:0;width:330px;max-height:min(74%,460px);background:var(--raise);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;transform:scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .16s,transform .16s;z-index:20;display:flex;flex-direction:column;overflow:hidden}
.panel.open{opacity:1;transform:none;pointer-events:auto}
.p-head{display:flex;align-items:center;gap:8px;padding:8px 8px 0 16px}
.p-body{padding:4px 16px 14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.p-title{font:500 18px/1.3 var(--font-display);text-wrap:balance}
.p-meta{color:var(--ink-2);font-size:13px}
.p-meta .mono{color:var(--ink)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 13px}
.callout small{display:block;font:600 11px var(--font-body);letter-spacing:.08em;color:var(--accent-text);margin-bottom:3px}
.notes{white-space:pre-wrap;color:var(--ink-2);overflow-wrap:anywhere}
.p-sec h5{margin:0 0 7px;font:600 11px var(--font-body);letter-spacing:.1em;color:var(--ink-3)}
.rel-g{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.rel-g>span{font-size:12px;color:var(--ink-2);font-weight:500}
.rel-i{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1px solid var(--line-2);text-align:left;width:100%}
.rel-i:hover{border-color:var(--ink-3)}
.rel-i span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-foot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.star-on{color:var(--accent)}
.star-on svg{fill:currentColor}

/* ---------- dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,22,.55);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:14px}
.dialog{width:min(680px,100%);max-height:100%;background:var(--raise);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:pop .2s ease-out}
.dialog.sm{width:min(430px,100%)}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:.6}}
.dlg-head{display:flex;align-items:center;padding:14px 14px 6px 22px}
.dlg-head h2{font:500 22px var(--font-display);flex:1}
.dlg-body{padding:10px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dlg-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line-2);background:var(--surface)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.field input,.field textarea,.field select,.rel-row select{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 11px;outline:none;width:100%;min-width:0}
.field textarea{resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.chips-in:focus-within{border-color:var(--accent);background:var(--raise)}
.field .row{display:flex;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .wide{grid-column:1/-1}
.chips-in{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 8px}
.chips-in input{border:0;background:none;padding:2px 4px;flex:1;min-width:90px;width:auto}
.chips-in .chip button{color:var(--ink-3);line-height:1;font-size:15px}
.tag-sug{display:flex;flex-wrap:wrap;gap:5px}
.tag-sug button{font-size:12px;color:var(--ink-3);padding:1px 8px;border:1px dashed var(--line);border-radius:999px}
.tag-sug button:hover{color:var(--ink);border-color:var(--ink-3)}
.rel-list{display:flex;flex-direction:column;gap:6px}
.rel-row{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
.rel-row .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.rel-row .me{color:var(--ink-3);flex:none;font-size:12.5px}
.rel-row select{width:auto;padding:4px 6px;border-radius:8px;font-size:13px;flex:none}
.rel-row .icon-btn{width:28px;height:28px}
.rel-add{position:relative}
.check{display:flex;align-items:center;gap:9px;height:38px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:center}
.keys kbd{font:500 12px var(--font-mono);border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface);justify-self:start}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:11px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-weight:500;animation:pop .2s ease-out;max-width:90vw}
.toast button{color:var(--accent);font-weight:600}
.toast.bad{background:var(--bad);color:#fff}
.rail-scrim{display:none}

/* ---------- phone ---------- */
@media (max-width:860px){
  .only-m{display:inline-grid}
  .top{flex-wrap:wrap;gap:8px 8px;padding:8px 12px}
  .brand-sub,.search kbd,.hint,.lbl-d{display:none}
  .search{order:5;flex:1 1 calc(100% - 160px);max-width:none}
  .top .seg{order:6}
  .top .seg button{padding:5px 10px}

<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clip=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const TAU=Math.PI*2, RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LS_DB='mailuo_db', LS_UI='mailuo_ui';

/* ---------- icons ---------- */
const I={
 plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
 more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
 filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',zin:'<path d="M12 6v12M6 12h12"/>',zout:'<path d="M6 12h12"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/>',
 swap:'<path d="M7 7h13l-3-3M17 17H4l3 3"/>',key:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/>',
 spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
 label:'<path d="M5 7h14M5 12h9M5 17h12"/>',pin:'<path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"/>',relay:'<path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
$$('[data-ic]').forEach(el=>{el.outerHTML=ic(el.dataset.ic,+el.dataset.s||18)});
function shapeSvg(t,s=14,hollow=false){
  const c=`var(--c-${t})`, a=hollow?`fill="none" stroke="${c}" stroke-width="2"`:`fill="${c}"`;
  const p={paper:`<circle cx="8" cy="8" r="${hollow?5:6}" ${a}/>`,concept:`<path d="M8 1.5 14.5 8 8 14.5 1.5 8z" ${a}/>`,
    method:`<path d="M8 1.6 13.6 4.8v6.4L8 14.4 2.4 11.2V4.8z" ${a}/>`,question:`<rect x="2.3" y="2.3" width="11.4" height="11.4" rx="3.4" ${a}/>`}[t];
  return `<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true">${p}</svg>`;
}

/* ---------- vocabulary ---------- */
const TYPES={
  paper:{label:'文献',core:'核心内容',call:'核心内容'},
  concept:{label:'概念',core:'定义（一句话）',call:'定义'},
  method:{label:'方法',core:'目的（一句话）',call:'目的'},
  question:{label:'问题',core:'问题描述',call:'问题'}};
const STATUS={todo:'未读',read:'已读',deep:'精读'};
const RELS={
  based:{label:'基于',inv:'后续工作',directed:true,col:'ink3'},
  improves:{label:'改进',inv:'被改进为',directed:true,col:'good'},
  refutes:{label:'反驳',inv:'被反驳',directed:true,col:'bad'},
  uses:{label:'使用方法',inv:'用到它的文献',directed:true,col:'method'},
  about:{label:'涉及概念',inv:'涉及它的文献',directed:true,col:'concept'},
  answers:{label:'回答问题',inv:'回答它的文献',directed:true,col:'question'},
  related:{label:'相关',inv:'相关',directed:false,col:'ink3'}};
function defaultLink(a,b){
  const m={concept:'about',method:'uses',question:'answers'};
  if(a==='paper'&&b==='paper')return{rel:'based',dir:'out'};
  if(a==='paper'&&m[b])return{rel:m[b],dir:'out'};
  if(b==='paper'&&m[a])return{rel:m[a],dir:'in'};
  return{rel:'related',dir:'out'};
}

/* ---------- data ---------- */
let db={version:1,nodes:[],edges:[],demo:false,gone:[],libEdges:[]},libReady=false;
let byId=new Map(), adj=new Map();
const ui={view:'graph',layout:'force',theme:null,labels:true,q:'',sel:null,linkMode:false,sort:{key:'year',dir:-1},
  f:{types:new Set(Object.keys(TYPES)),status:new Set(Object.keys(STATUS)),tags:new Set(),y0:null,y1:null}};
const undoStack=[];

function normalize(d){
  const out={version:1,nodes:[],edges:[],demo:false,gone:Array.isArray(d.gone)?d.gone.map(String):[],libEdges:Array.isArray(d.libEdges)?d.libEdges.map(String):[]};
  for(const n of (Array.isArray(d.nodes)?d.nodes:[])){
    if(!n||!n.id||!TYPES[n.type])continue;
    out.nodes.push({id:String(n.id),type:n.type,title:String(n.title||'未命名'),authors:String(n.authors||''),year:Number.isFinite(+n.year)&&+n.year?+n.year:null,
      venue:String(n.venue||''),doi:String(n.doi||''),url:String(n.url||''),key:String(n.key||''),core:String(n.core||''),notes:String(n.notes||''),
      tags:Array.isArray(n.tags)?n.tags.map(String).filter(Boolean):[],status:STATUS[n.status]?n.status:'todo',star:!!n.star,created:n.created||today(),
      x:Number.isFinite(n.x)?n.x:undefined,y:Number.isFinite(n.y)?n.y:undefined,pin:!!n.pin&&Number.isFinite(n.px)&&Number.isFinite(n.py),px:n.px,py:n.py,libRev:n.libRev==null?undefined:String(n.libRev)});
  }
  const ids=new Set(out.nodes.map(n=>n.id));
  for(const e of (Array.isArray(d.edges)?d.edges:[])){
    if(e&&ids.has(e.source)&&ids.has(e.target)&&e.source!==e.target&&RELS[e.rel])out.edges.push({id:String(e.id||uid()),source:e.source,target:e.target,rel:e.rel});
  }
  return out;
}
function load(){
  try{const raw=localStorage.getItem(LS_DB); if(raw){db=normalize(JSON.parse(raw));
    const keep=db.nodes.filter(n=>!/^d-/.test(n.id)); // drop the old built-in examples
    if(keep.length!==db.nodes.length){const ids=new Set(keep.map(n=>n.id));db.nodes=keep;db.edges=db.edges.filter(e=>ids.has(e.source)&&ids.has(e.target))}
    return;}}catch(e){}
  db={version:1,nodes:[],edges:[],demo:false,gone:[],libEdges:[]};
}
/* ---------- shared library: library.json next to this page is the source of truth for entries stored from chat ---------- */
async function syncLibrary(){
  let lib;try{const r=await fetch('library.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;lib=await r.json()}catch(e){libReady=true;renderEmpty();return}
  const gone=new Set(db.gone||[]),seen=new Set(db.libEdges||[]);let ch=false,added=0;
  for(const L of (lib.nodes||[])){
    if(!L||!L.id||!TYPES[L.type]||gone.has(L.id))continue;
    const f={title:String(L.title||''),authors:String(L.authors||''),year:+L.year||null,venue:String(L.venue||''),doi:String(L.doi||''),url:String(L.url||''),core:String(L.core||'')},rev=String(L.rev||''),n=byId.get(L.id);
    if(!n){const m=normalize({nodes:[{...f,id:L.id,type:L.type,tags:L.tags||[]}]}).nodes[0];m.libRev=rev;db.nodes.push(m);byId.set(m.id,m);ch=true;added++}
    else if(n.libRev!==rev){Object.assign(n,f);n.libRev=rev;ch=true} // local edits stay until the library entry itself changes
  }
  for(const E of (lib.edges||[])){
    if(!E||!E.id||seen.has(E.id)||!byId.has(E.source)||!byId.has(E.target)||!RELS[E.rel])continue;
    seen.add(E.id);ch=true;if(!db.edges.some(x=>x.source===E.source&&x.target===E.target&&x.rel===E.rel))db.edges.push({id:String(E.id),source:E.source,target:E.target,rel:E.rel})}
  db.libEdges=[...seen];libReady=true;
  if(!ch)return renderEmpty();
  reindex();save();renderRail();refreshGraph(1);
  if(added){for(let i=0;i<320;i++)tick();fit(false);G.alpha=.03}
  renderList();renderDetail();renderChrome();
}
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS_DB,JSON.stringify(db))}catch(e){toast('保存失败：浏览器存储不可用，请先导出备份',{bad:true})}},200)}
function saveUi(){try{localStorage.setItem(LS_UI,JSON.stringify({view:ui.view,layout:ui.layout,theme:ui.theme,labels:ui.labels}))}catch(e){}}
function checkpoint(){undoStack.push(JSON.stringify(db));if(undoStack.length>40)undoStack.shift()}
function undo(){const s=undoStack.pop();if(!s)return toast('没有可以撤销的操作');db=JSON.parse(s);if(!db.nodes.some(n=>n.id===ui.sel))ui.sel=null;changed();toast('已撤销')}
function reindex(){
  byId=new Map(db.nodes.map(n=>[n.id,n]));adj=new Map(db.nodes.map(n=>[n.id,new Set()]));
  db.edges=db.edges.filter(e=>byId.has(e.source)&&byId.has(e.target));
  for(const e of db.edges){adj.get(e.source).add(e.target);adj.get(e.target).add(e.source)}
}
function changed(heat=.7){reindex();save();renderRail();refreshGraph(heat);renderList();renderDetail();renderChrome()}
function passes(n){
  const f=ui.f; if(!f.types.has(n.type))return false;
  if(n.type==='paper'){ if(!f.status.has(n.status))return false;
    if(n.year){if(f.y0!=null&&n.year<f.y0)return false;if(f.y1!=null&&n.year>f.y1)return false} }
  if(f.tags.size&&!n.tags.some(t=>f.tags.has(t)))return false;
  return true;
}
function matches(n,q){
  if(!q)return true;
  const hay=[n.title,n.authors,n.core,n.venue,n.year||'',n.key||'',n.tags.join(' '),TYPES[n.type].label].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function search(q,pool){
  q=q.trim();const l=q.toLowerCase(),rank=n=>{const t=n.title.toLowerCase();return t===l?0:t.startsWith(l)?1:t.includes(l)?2:3};
  return pool.filter(n=>matches(n,q)).sort((a,b)=>rank(a)-rank(b));
}
function shortLabel(n){
  if(n.type!=='paper')return clip(n.title,20);
  const au=n.authors||'', first=au.split(/[,;，；]|\s+and\s+/)[0].replace(/et al\.?/i,'').trim();
  let fam=first; if(first&&!/[一-鿿]/.test(first)){const p=first.split(/\s+/);fam=p[p.length-1]}
  const multi=/[,;，；]|\s+and\s+|et al/i.test(au);
  return (fam?fam+(multi?' 等':''):clip(n.title,16))+(n.year?' '+n.year:'');
}
function filtersActive(){const f=ui.f;return f.types.size<4||f.status.size<3||f.tags.size>0||f.y0!=null||f.y1!=null}
function resetFilters(){ui.f={types:new Set(Object.keys(TYPES)),status:new Set(Object.keys(STATUS)),tags:new Set(),y0:null,y1:null}}

/* ---------- toast / ask ---------- */
function toast(msg,o={}){
  const el=document.createElement('div');el.className='toast'+(o.bad?' bad':'');el.innerHTML=`<span>${esc(msg)}</span>`;
  if(o.action){const b=document.createElement('button');b.textContent=o.action.label;b.onclick=()=>{o.action.fn();el.remove()};el.appendChild(b)}
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),o.action?6000:2600);
}
function ask(title,body,buttons){
  return new Promise(res=>{
    $('#askT').textContent=title;$('#askB').innerHTML=`<p style="color:var(--ink-2)">${esc(body)}</p>`;
    const f=$('#askF');f.innerHTML='<span class="grow"></span>';
    for(const b of buttons){const el=document.createElement('button');el.type='button';el.className='btn '+(b.kind||'');el.textContent=b.label;el.onclick=()=>{$('#askScrim').hidden=true;res(b.value)};f.appendChild(el)}
    $('#askScrim').hidden=false;f.lastChild.focus();
    askCancel=()=>{$('#askScrim').hidden=true;res(null)};
  });
}

function renderRail(){

    <div class="stat-row"><span>读过 <b>${done}</b> / ${papers.length}</span><span>${lonely?`<b>${lonely}</b> 个还没连线`:'全部已连线'}</span></div>
  </section>

    `<button data-type="${t}" aria-pressed="${ui.f.types.has(t)}">${shapeSvg(t)}<span>${TYPES[t].label}</span><span class="cnt">${cnt(t)}</span></button>`).join('')}</div></section>

      <div class="dual"><input type="range" id="y0" min="${lo}" max="${hi}" value="${ui.f.y0??lo}" aria-label="起始年份"><input type="range" id="y1" min="${lo}" max="${hi}" value="${ui.f.y1??hi}" aria-label="结束年份"></div>

function paintYears(){

$('#rail').addEventListener('click',e=>{

  let i=0;for(const n of G.vis){ if(n.x===undefined||n.y===undefined){ // place near a neighbour, else on a loose ring
      const nb=[...(adj.get(n.id)||[])].map(id=>byId.get(id)).find(m=>m&&m.x!==undefined);
      const a=Math.random()*TAU,r=nb?70:140+40*Math.sqrt(i++);

function tick(){

      if(d2<.01){dx=Math.random()-.5;dy=Math.random()-.5;d2=dx*dx+dy*dy}
      if(d2>640000)continue;
      const f=1000*a/d2,vb=V(B);va.vx-=dx*f;va.vy-=dy*f;vb.vx+=dx*f;vb.vy+=dy*f;
      const min=rad(A)+rad(B)+80,ex=dx/1.9,e2=ex*ex+dy*dy; if(e2<min*min){const d=Math.sqrt(e2)||1,p=(min-d)/d*.12;va.vx-=dx*p;va.vy-=dy*p;vb.vx+=dx*p;vb.vy+=dy*p} // labels are wider than tall
    }}

    const L=(tl?190:170)+rad(A)+rad(B),f=(d-L)/d*(tl?.05:.16)*a,va=V(A),vb=V(B);va.vx+=dx*f;va.vy+=dy*f;vb.vx-=dx*f;vb.vy-=dy*f}

    if(tl){ if(A.type==='paper'&&A.year&&G.yx.has(A.year)){v.vx+=(G.yx.get(A.year)-A.x)*.3*a;v.vy+=(0-A.y)*.1*a}
      else{const band=A.type==='paper'?0:A.type==='concept'?-210:210;v.vy+=(band-A.y)*.16*a;v.vx-=A.x*.004*a} }
    else{v.vx-=A.x*gx*a;v.vy-=A.y*gy*a}

const wrapCache=new Map();

  L=[];let cur='';
  for(const t of toks){const nx=cur+t;if(cur&&ctx.measureText(nx.trimEnd()).width>maxW){L.push(cur.trimEnd());cur=t.trimStart()}else cur=nx}
  if(cur.trim())L.push(cur.trimEnd());
  if(L.length>3){L=L.slice(0,3);L[2]=L[2].replace(/\s*\S{0,2}$/,'')+'…'}

function shape(t,x,y,r){

  else if(t==='concept'){const q=r*1.18;ctx.moveTo(x,y-q);ctx.lineTo(x+q,y);ctx.lineTo(x,y+q);ctx.lineTo(x-q,y);ctx.closePath()}

function rr(x,y,w,h,r){if(ctx.roundRect){ctx.roundRect(x,y,w,h,r)}else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}}

async function autofill(){

  if(!doi)return toast('认不出这个编号。DOI 以 10. 开头，arXiv 编号形如 2312.03982',{bad:true});

    let m=null;

function parseBib(text){
  const out=[],n=text.length,mac={};let i=0;
  const close=(s,p)=>{let d=1;while(p<s.length&&d>0){const c=s[p];if(c==='\\'){p+=2;continue}if(c==='{')d++;else if(c==='}')d--;p++}return p};
  while(i<n){

    const m=/^@\s*([a-zA-Z]+)\s*\{/.exec(text.slice(at,at+40));if(!m){i=at+1;continue}
    const type=m[1].toLowerCase(),j=at+m[0].length,k=close(text,j),body=text.slice(j,k-1);i=k;
    if(type==='string'){const sm=/^\s*([\w-]+)\s*=\s*["{]([\s\S]*)["}]\s*$/.exec(body);if(sm)mac[sm[1].toLowerCase()]=sm[2];continue}

    const key=body.slice(0,comma).trim(),f={};let p=comma+1;if(!key||/\s/.test(key))continue;
    while(p<body.length){
      const fm=/\s*([a-zA-Z_][\w-]*)\s*=\s*/y;fm.lastIndex=p;const r=fm.exec(body);
      if(!r){const nc=body.indexOf(',',p);if(nc<0)break;p=nc+1;continue}
      p=fm.lastIndex;let val='';
      if(body[p]==='{'){const q=close(body,p+1);val=body.slice(p+1,q-1);p=q}
      else if(body[p]==='"'){let q=p+1,d=0;while(q<body.length&&(body[q]!=='"'||d>0)){const c=body[q];if(c==='\\'){q+=2;continue}if(c==='{')d++;else if(c==='}')d--;q++}val=body.slice(p+1,q);p=q+1}
      else{const q=body.slice(p).search(/[,\n]/),e=q<0?body.length:p+q;val=body.slice(p,e).trim();val=mac[val.toLowerCase()]??val;p=e}
      f[r[1].toLowerCase()]=val;const sk=/\s*,?/y;sk.lastIndex=p;sk.exec(body);p=sk.lastIndex;

function detex(s){
  const acc={'"':'̈',"'":'́','`':'̀','^':'̂','~':'̃','=':'̄','.':'̇',c:'̧',v:'̌',u:'̆',H:'̋',k:'̨',r:'̊'};
  s=String(s||'').replace(/\\(ss|ae|AE|aa|AA|[oOlLij])(?![a-zA-Z])\s*/g,(m,c)=>({o:'ø',O:'Ø',l:'ł',L:'Ł',ss:'ß',ae:'æ',AE:'Æ',aa:'å',AA:'Å',i:'ı',j:'ȷ'}[c]));
  s=s.replace(/\\(["'`^~=.])\s*\{?\s*([a-zA-Zıȷ])\s*\}?/g,(m,a,ch)=>((ch==='ı'?'i':ch==='ȷ'?'j':ch)+acc[a]).normalize('NFC'));
  s=s.replace(/\\([cvuHkr])\s*\{\s*([a-zA-Z])\s*\}/g,(m,a,ch)=>(ch+acc[a]).normalize('NFC'));
  s=s.replace(/\\(?:text(?:it|bf|rm|sc|sf|tt)|emph|mathrm|mbox)\s*\{([^{}]*)\}/g,'$1');
  s=s.replace(/---/g,'—').replace(/--/g,'–').replace(/~/g,' ').replace(/\\-/g,'').replace(/\\([&%_#])/g,'$1').replace(/\\ /g,' ');
  let out='',math=false;for(const ch of s){if(ch==='$')math=!math;if(!math&&(ch==='{'||ch==='}'))continue;out+=ch}
  return out.replace(/\s+/g,' ').trim();

function bibAuthors(a){

  for(const p of detex(a).split(/\s+and\s+/i).map(x=>x.trim()).filter(Boolean)){
    if(/^others$/i.test(p)){etal=true;continue}const c=p.split(',');names.push(c.length>1?(c.slice(1).join(' ').trim()+' '+c[0].trim()).trim():p)}
  return names.length>8?names.slice(0,3).join(', ')+' et al.':names.join(', ')+(etal?' et al.':'');

$('#bibIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{importBib(await f.text())}catch(_){toast('读取文件失败',{bad:true})}});
function showKeys(){
  $('#askT').textContent='快捷键';
  $('#askB').innerHTML=`<div class="keys">${[['N','新建条目'],['/','搜索'],['F','适应窗口'],['L','连线模式'],['1 / 2','图谱 / 文献表'],['T','力导向 / 时间轴'],['E','编辑选中的条目'],['Delete','删除选中的条目'],['Ctrl+Z','撤销'],['Esc','关闭']].map(([k,v])=>`<kbd>${k}</kbd><span>${v}</span>`).join('')}</div>`;
  $('#askF').innerHTML='<span class="grow"></span><button type="button" class="btn primary">知道了</button>';$('#askF button').onclick=()=>$('#askScrim').hidden=true;
  askCancel=()=>{$('#askScrim').hidden=true};$('#askScrim').hidden=false;
}
$('#askScrim').addEventListener('pointerdown',e=>{if(e.target===e.currentTarget&&askCancel)askCancel()});

/* search */
const qIn=$('#q');
function paintQDrop(){
  const q=ui.q.trim(),d=$('#qDrop');if(!q){d.hidden=true;return}
  const hits=search(q,db.nodes).slice(0,8);
  d.innerHTML=hits.length?hits.map((n,i)=>`<button data-id="${esc(n.id)}" class="${i?'':'act'}">${shapeSvg(n.type,12,n.type==='paper'&&n.status==='todo')}<span class="d-t">${esc(n.title)}</span><span class="d-m">${esc(n.type==='paper'?shortLabel(n):TYPES[n.type].label)}</span></button>`).join('')
    :`<div class="muted" style="padding:8px 10px">没有找到「${esc(clip(q,24))}」</div>`;
  d.hidden=false;
}
qIn.addEventListener('input',()=>{ui.q=qIn.value;refreshGraph(0);renderList();paintQDrop()});
qIn.addEventListener('focus',paintQDrop);
qIn.addEventListener('keydown',e=>{
  if(e.isComposing)return;const items=$$('#qDrop button'),i=items.findIndex(b=>b.classList.contains('act'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;items[i]?.classList.remove('act');const j=(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[j].classList.add('act');items[j].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();(items[i]||items[0])?.click()}
  else if(e.key==='Escape'){qIn.value='';ui.q='';refreshGraph(0);renderList();$('#qDrop').hidden=true;qIn.blur()}
});
$('#qDrop').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#qDrop').hidden=true;qIn.blur();select(b.dataset.id,true)});

/* keyboard */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if(e.key==='Escape'){
    if(!$('#askScrim').hidden){askCancel&&askCancel();return}
    if(!$('#edScrim').hidden){if(!$('#relDrop').hidden){$('#relDrop').hidden=true;return}closeEditor();return}
    if(typing)return; if(!$('#relPop').hidden)return closeRelPop(); if(!$('#menu').hidden){$('#menu').hidden=true;return}
    if($('#rail').classList.contains('open'))return toggleRail(false);
    if(ui.linkMode){ui.linkMode=false;return renderChrome()} if(ui.sel)select(null);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();qIn.focus();qIn.select();return}
  if(typing||!$('#edScrim').hidden||!$('#askScrim').hidden)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();return undo()}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='/'){e.preventDefault();qIn.focus();qIn.select()}
  else if(k==='n'){e.preventDefault();openEditor()}
  else if(k==='f')fit();
  else if(k==='l'){ui.linkMode=!ui.linkMode;renderChrome()}
  else if(k==='t')setLayout(ui.layout==='force'?'time':'force');
  else if(k==='1')setView('graph'); else if(k==='2')setView('list');
  else if(k==='e'&&ui.sel)openEditor(ui.sel);
  else if((k==='delete'||k==='backspace')&&ui.sel)removeNode(ui.sel);
});

/* ---------- boot ---------- */
try{const s=JSON.parse(localStorage.getItem(LS_UI)||'{}');if(s.view==='list'||s.view==='graph')ui.view=s.view;if(s.layout==='time')ui.layout='time';if(s.theme)ui.theme=s.theme;if(s.labels===false)ui.labels=false}catch(e){}
document.documentElement.dataset.theme=ui.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
$('meta[name=theme-color]').content=document.documentElement.dataset.theme==='dark'?'#090e1a':'#f8fafd';
load();reindex();readCols();renderRail();renderChrome();resize();
const unplaced=db.nodes.some(n=>n.x===undefined);refreshGraph(unplaced?1:0);
if(unplaced)for(let i=0;i<260;i++)tick();
fit(false);G.alpha=unplaced?.05:0;renderList();renderDetail();
new ResizeObserver(()=>{const had=G.w;resize();if(!had&&G.w)fit(false)}).observe($('#stage'));
if(document.fonts?.ready)document.fonts.ready.then(()=>{G.dirty=true});
syncLibrary();
window.addEventListener('beforeunload',()=>{try{clearTimeout(saveT);if(byId.size||localStorage.getItem(LS_DB))localStorage.setItem(LS_DB,JSON.stringify(db))}catch(e){}});
window.__mailuo={get db(){return db},G,ui,fit,parseBib,detex};
requestAnimationFrame(frame);
})();
</script>
</body>
