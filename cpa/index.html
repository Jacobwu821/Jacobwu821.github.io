/* =================== 图表 =================== */
function niceTicks(max, n = 4) {
  if (!(max > 0)) max = 1;
  const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const top = Math.ceil(max / step - 1e-9) * step, ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(+v.toFixed(6));
  return { ticks, top };
}
const tickH = t => (t === 0 ? '0' : t < 1 ? `${Math.round(t * 60)}m` : `${+t.toFixed(2)}h`);
function roundTop(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h)); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function showTip(html, cx, cy) {
  const t = $('#tip'); t.innerHTML = html; t.hidden = false;
  const r = t.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  let x = cx + 14, y = cy - r.height - 12;
  if (x + r.width > vw - 8) x = cx - r.width - 14;
  if (x < 8) x = 8;
  if (y < 8) y = cy + 16;
  if (y + r.height > vh - 8) y = vh - r.height - 8;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTip() { const t = $('#tip'); if (t) t.hidden = true; }

function drawBars() {
  const host = $('#bar-chart'); if (!host) return;
  const R = UI.statsRange, tk = todayKey(), dm = dayMap(), live = sessionsLive();
  const firstKey = live.length ? dayKey(live[0].start) : tk;
  const startKey = R ? addDays(tk, -(R - 1)) : (firstKey < tk ? firstKey : tk);
  const span = diffDays(startKey, tk) + 1, weekly = span > 120;
  const order = orderedCourseIds();
  const buckets = [];
  if (!weekly) {
    for (let i = 0; i < span; i++) { const k = addDays(startKey, i), d = dm.get(k); buckets.push({ k, label: span <= 14 ? `${keyDate(k).getDate()} ${WD[keyDate(k).getDay()]}` : `${keyDate(k).getMonth() + 1}/${keyDate(k).getDate()}`, title: mdw(k), by: d?.by || {}, total: d?.total || 0 }); }
  } else {
    let w = mondayOf(startKey);
    while (w <= tk) {
      const by = {}; let total = 0;
      for (let j = 0; j < 7; j++) { const d = dm.get(addDays(w, j)); if (!d) continue; total += d.total; for (const id in d.by) by[id] = (by[id] || 0) + d.by[id]; }
      buckets.push({ k: w, label: `${keyDate(w).getMonth() + 1}/${keyDate(w).getDate()}`, title: `${md(w)} 起的一周`, by, total, week: true });
      w = addDays(w, 7);
    }
  }
  const W = Math.max(300, host.clientWidth), H = W < 520 ? 210 : 250;
  const m = { l: 40, r: 10, t: 18, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const goalH = weekly ? 0 : S.settings.dailyGoal / 60;
  const maxV = Math.max(goalH, ...buckets.map(b => b.total / 3600), 0.5);
  const { ticks, top } = niceTicks(maxV);
  const y = v => m.t + ih - (v / top) * ih;
  const n = buckets.length, slot = iw / n, bw = clamp(slot * 0.66, 2, 30);
  let s = '';
  for (const t of ticks) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="ax" x="${m.l - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${tickH(t)}</text>`;
  s += `<rect class="hl" id="bar-hl" x="0" y="${m.t}" width="${slot.toFixed(2)}" height="${ih}"/>`;
  buckets.forEach((b, i) => {
    const x0 = m.l + slot * i + (slot - bw) / 2;
    const segs = order.filter(id => (b.by[id] || 0) > 0);
    let acc = 0;
    segs.forEach((id, j) => {
      const v = b.by[id] / 3600;
      const yb = y(acc) - (j ? 1 : 0), yt = y(acc + v) + (j < segs.length - 1 ? 1 : 0), h = yb - yt;
      if (h > 0.4) s += j === segs.length - 1 ? `<path d="${roundTop(x0, yt, bw, h, 3)}" style="fill:${cvar(id)}"/>` : `<rect x="${x0.toFixed(2)}" y="${yt.toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}" style="fill:${cvar(id)}"/>`;
      acc += v;
    });
  });
  s += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  if (goalH) s += `<line class="goal" x1="${m.l}" x2="${W - m.r}" y1="${y(goalH).toFixed(1)}" y2="${y(goalH).toFixed(1)}"/><text class="goal-t" x="${W - m.r}" y="${(y(goalH) - 6).toFixed(1)}" text-anchor="end">每日目标 ${tickH(goalH)}</text>`;
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / (span <= 14 ? 44 : 50)))));
  buckets.forEach((b, i) => { if ((n - 1 - i) % every === 0) s += `<text class="ax" x="${(m.l + slot * (i + 0.5)).toFixed(1)}" y="${H - 8}" text-anchor="middle">${b.label}</text>`; });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="每日学习时长柱状图">${s}</svg>`;
  const svg = host.querySelector('svg'), hl = $('#bar-hl');
  const idxAt = e => { const r = svg.getBoundingClientRect(); const x = ((e.clientX - r.left) / r.width) * W; const i = Math.floor((x - m.l) / slot); return i >= 0 && i < n ? i : -1; };
  svg.addEventListener('pointermove', e => {
    const i = idxAt(e); if (i < 0) { hl.classList.remove('on'); hideTip(); return; }
    const b = buckets[i]; hl.setAttribute('x', (m.l + slot * i).toFixed(2)); hl.classList.add('on');
    const rows = order.filter(id => b.by[id] > 0).map(id => `<div class="r"><i style="--c:${cvar(id)}"></i>${esc(courseName(id))}<span class="v">${hm(b.by[id])}</span></div>`).join('');
    showTip(`<b>${b.title}</b>${rows || '<div>没有记录</div>'}<div class="tot"><span>合计</span><span class="num">${hm(b.total)}</span></div>`, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', () => { hl.classList.remove('on'); hideTip(); });
  svg.addEventListener('click', e => { const i = idxAt(e); if (i >= 0 && !buckets[i].week) { hideTip(); dayModal(buckets[i].k); } });
}

function drawCase() {
  const host = $('#case-chart'); if (!host) return;
  const filt = s => UI.caseCourse === 'all' || s.courseId === UI.caseCourse;
  const pts = sessionsLive().filter(s => s.mode === 'down' && s.caseType === UI.caseSel && filt(s));
  if (!pts.length) return;
  const ref = UI.caseSel;
  const W = Math.max(300, host.clientWidth), H = W < 520 ? 240 : 290;
  const m = { l: 44, r: 22, t: 26, b: 30 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ys = pts.map(s => s.dur / 60);
  const maxV = Math.max(...ys, ...pts.map(s => s.target || 0), ref) * 1.08;
  const { ticks, top } = niceTicks(maxV, 5);
  const n = pts.length;
  const x = i => (n === 1 ? m.l + iw / 2 : m.l + (i / (n - 1)) * iw);
  const y = v => m.t + ih - (v / top) * ih;
  let s = '';
  for (const t of ticks) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="ax" x="${m.l - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${+t.toFixed(1)}</text>`;
  s += `<text class="axl" x="${m.l - 8}" y="${m.t - 12}" text-anchor="end">分钟</text>`;
  s += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${y(ref).toFixed(1)}" y2="${y(ref).toFixed(1)}"/><text class="ref-t" x="${m.l + 6}" y="${(y(ref) - 6).toFixed(1)}">建议 ${ref} 分</text>`;
  const tp = pts.map((p, i) => (p.target ? `${x(i).toFixed(1)},${y(p.target).toFixed(1)}` : null)).filter(Boolean);
  if (tp.length > 1) s += `<polyline class="tline" points="${tp.join(' ')}"/>`;
  else if (tp.length === 1) { const [px, py] = tp[0].split(','); s += `<line class="tline" x1="${+px - 14}" x2="${+px + 14}" y1="${py}" y2="${py}"/>`; }
  const line = ys.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  if (n > 1) s += `<path class="area" d="${line}L${x(n - 1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z"/><path class="line" d="${line}"/>`;
  s += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  s += `<line class="xh" id="case-xh" x1="0" x2="0" y1="${m.t}" y2="${y(0)}"/>`;
  pts.forEach((p, i) => {
    const over = p.target && ys[i] > p.target + 0.5;
    s += `<circle class="pt" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(ys[i]).toFixed(1)}" r="${i === n - 1 ? 5.5 : 4.5}" style="${over ? 'fill:var(--surface);stroke:var(--red);stroke-width:2.2' : 'fill:var(--accent);stroke:var(--surface);stroke-width:2'}"/>`;
  });
  const lx = x(n - 1), ly = y(ys[n - 1]);
  s += `<text class="pt-l" x="${lx.toFixed(1)}" y="${(ly - 12).toFixed(1)}" text-anchor="${n === 1 ? 'middle' : 'end'}">${Math.round(ys[n - 1])} 分</text>`;
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 42))));
  pts.forEach((p, i) => { if ((n - 1 - i) % every === 0 || i === 0) s += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">#${i + 1}</text>`; });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${ref} 分钟 case 每次实际用时折线图">${s}</svg>`;
  const svg = host.querySelector('svg'), xh = $('#case-xh');
  const idxAt = e => { const r = svg.getBoundingClientRect(); const px = ((e.clientX - r.left) / r.width) * W; if (px < m.l - 20 || px > W - m.r + 20) return -1; return n === 1 ? 0 : clamp(Math.round(((px - m.l) / iw) * (n - 1)), 0, n - 1); };
  svg.addEventListener('pointermove', e => {
    const i = idxAt(e); if (i < 0) { xh.classList.remove('on'); hideTip(); return; }
    const p = pts[i], v = Math.round(ys[i]);
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.classList.add('on');
    const d = p.target ? v - p.target : null;
    showTip(`<b>第 ${i + 1} 次 · ${md(dayKey(p.start))}</b>${p.title ? `<div>${esc(p.title)}</div>` : ''}<div class="r"><i style="--c:${cvar(p.courseId)}"></i>${esc(courseName(p.courseId))}</div><div class="tot"><span>实际 ${v} 分</span><span>${p.target ? `目标 ${p.target} 分` : '没有目标'}</span></div>${d != null ? `<div>${d > 0 ? `超出目标 ${d} 分钟` : `比目标快 ${-d} 分钟`}</div>` : ''}<div style="opacity:.7">点击可以编辑这条记录</div>`, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', () => { xh.classList.remove('on'); hideTip(); });
  svg.addEventListener('click', e => { const i = idxAt(e); if (i >= 0) { hideTip(); editSession(pts[i].id); } });
}

function drawHeatmap() {
  const host = $('#heatmap'); if (!host) return;
  const W = host.clientWidth || 600, cs = W < 480 ? 11 : 13, gap = 3, left = 22, top = 18;
  const weeks = clamp(Math.floor((W - left) / (cs + gap)), 8, 53);
  const end = todayKey(), start = addDays(mondayOf(end), -(weeks - 1) * 7);
  const dm = dayMap(), goal = S.settings.dailyGoal * 60;
  let s = '', lastM = -1, lastW = -9;
  for (let w = 0; w < weeks; w++) {
    const wk = addDays(start, w * 7), mo = keyDate(addDays(wk, 6)).getMonth();
    if (mo !== lastM) { if (w - lastW >= 3) { s += `<text class="ax" x="${left + w * (cs + gap)}" y="11">${mo + 1}月</text>`; lastW = w; } lastM = mo; }
    for (let d = 0; d < 7; d++) {
      const k = addDays(wk, d); if (k > end) continue;
      const v = dm.get(k)?.total || 0, lv = v <= 0 ? 0 : v < goal * 0.25 ? 1 : v < goal * 0.5 ? 2 : v < goal ? 3 : 4;
      s += `<rect class="hc lv${lv}" x="${left + w * (cs + gap)}" y="${top + d * (cs + gap)}" width="${cs}" height="${cs}" rx="2.5" data-k="${k}"/>`;
    }
  }
  [[0, '一'], [2, '三'], [4, '五']].forEach(([d, l]) => { s += `<text class="ax" x="0" y="${top + d * (cs + gap) + cs - 2}">${l}</text>`; });
  const SW = left + weeks * (cs + gap), SH = top + 7 * (cs + gap);
  host.innerHTML = `<svg viewBox="0 0 ${SW} ${SH}" width="${SW}" height="${SH}" role="img" aria-label="最近 ${weeks} 周学习热力图">${s}</svg>`;
  const svg = host.querySelector('svg');
  svg.addEventListener('pointermove', e => {
    const c = e.target.closest('.hc'); if (!c) { hideTip(); return; }
    const k = c.dataset.k, v = dm.get(k)?.total || 0;
    showTip(`<b>${mdw(k)}</b><div>${v ? `学习 ${hm(v)}` : '没有记录'}${checkedDay(k) ? ' · 已打卡' : ''}</div>`, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', hideTip);
  svg.addEventListener('click', e => { const c = e.target.closest('.hc'); if (c) { hideTip(); dayModal(c.dataset.k); } });
}
function mountView() {
  if (UI.view === 'stats') { drawBars(); drawCase(); }
  if (UI.view === 'checkin') drawHeatmap();
}
let roW = 0;
const ro = new ResizeObserver(entries => {
  const w = Math.round(entries[0].contentRect.width);
  if (Math.abs(w - roW) < 8) return;
  roW = w;
  requestAnimationFrame(mountView);
});

/* =================== 提示条 =================== */
function toast(msg, { action, fn, ms = 4500, kind = '' } = {}) {
  const host = $('#toasts'); if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.setAttribute('role', 'status');
  el.innerHTML = `<span class="tx">${esc(msg)}</span>${action ? `<button class="t-act">${esc(action)}</button>` : ''}<button class="t-x" aria-label="关闭提示">${icon('x')}</button>`;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  const kill = () => { el.classList.remove('in'); setTimeout(() => el.remove(), 220); };
  const tm = setTimeout(kill, action ? Math.max(ms, 8000) : ms);
  el.querySelector('.t-act')?.addEventListener('click', () => { clearTimeout(tm); kill(); if (fn) fn(); });
  el.querySelector('.t-x').addEventListener('click', () => { clearTimeout(tm); kill(); });
  while (host.children.length > 3) host.firstElementChild.remove();
}

/* =================== 弹窗 =================== */
const Modal = {
  stack: [],
  open(cfg) {
    const wrap = document.createElement('div');
    const n = Date.now().toString(36);
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="scrim" data-close></div><div class="modal${cfg.wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mt-${n}" tabindex="-1"><header><h3 id="mt-${n}">${esc(cfg.title)}</h3><button class="btn icon ghost" data-close aria-label="关闭">${icon('x')}</button></header><div class="m-body">${cfg.body}</div>${cfg.foot ? `<footer>${cfg.foot}</footer>` : ''}</div>`;
    document.body.appendChild(wrap);
    const entry = { wrap, cfg, prev: document.activeElement };
    this.stack.push(entry);
    wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) { e.preventDefault(); this.close(entry); } });
    if (cfg.onMount) cfg.onMount(wrap, entry);
    const af = wrap.querySelector('[autofocus]');
    setTimeout(() => (af || wrap.querySelector('.modal')).focus(), 20);
    document.body.classList.add('modal-open');
    return entry;
  },
  close(entry) {
    const i = entry ? this.stack.indexOf(entry) : this.stack.length - 1;
    if (i < 0) return;

    if (m.cfg.onClose) m.cfg.onClose();
    if (!this.stack.length) document.body.classList.remove('modal-open');
    try { if (m.prev && document.contains(m.prev)) m.prev.focus(); } catch (e) {}

  refresh() { for (const m of this.stack) if (m.cfg.refresh) m.cfg.refresh(m.wrap); }
};

function readSessionForm(w, rec) {
  const v = id => w.querySelector('#' + id).value;
  const courseId = v('sf-course'), mode = v('sf-mode') === 'down' ? 'down' : 'up';
  const caseType = mode === 'down' && v('sf-case') ? +v('sf-case') : null;
  let target = mode === 'down' ? Math.round(+v('sf-target')) || null : null;
  if (mode === 'down' && !target && caseType) target = caseType;
  const h = Math.max(0, Math.floor(+v('sf-h') || 0)), mm = Math.max(0, Math.floor(+v('sf-m') || 0));
  let dur = (h * 60 + mm) * 60;
  if (h * 60 + mm === Math.round(rec.dur / 60) && rec.dur > 0) dur = rec.dur;
  if (dur <= 0) return { err: '学习时长要大于 0' };
  if (dur > 24 * 3600) return { err: '单条记录不能超过 24 小时，可以拆成两条' };
  const date = v('sf-date'), time = v('sf-time');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !/^\d{2}:\d{2}/.test(time)) return { err: '请填写学习日和开始时间' };
  const same = date === dayKey(rec.start) && time === hhmm(rec.start);
  const start = same ? rec.start : composeStart(date, time.slice(0, 5));
  if (start > Date.now() + 60000) return { err: '开始时间在未来，请检查日期' };
  const pause = Math.max(0, ((rec.end || rec.start) - rec.start) / 1000 - rec.dur) || 0;
  const end = same && dur === rec.dur && rec.end ? rec.end : Math.round(start + (dur + pause) * 1000);
  return { rec: { ...rec, courseId, mode, caseType, target, title: v('sf-title').trim(), note: v('sf-note').trim(), start, end, dur } };
}
function saveSession(r, kind, opt) {

/* ---------- 导入导出 ---------- */
let dlCap;
async function getDownloads() {
  if (dlCap !== undefined) return dlCap;
  try { dlCap = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch (e) { dlCap = null; }
  return dlCap;
}
async function saveFile(name, text, mime) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename: name, data: text }); toast('已保存 ' + name); return true; }
    catch (e) { if (e && e.code === 'declined') { toast('已取消保存'); return false; } }
  }
  if (!window.claude) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: mime }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      toast('已下载 ' + name); return true;
    } catch (e) {}
  }
  const ent = Modal.open({
    title: '复制备份内容', wide: true,
    body: `<p class="muted sm">当前环境不能直接下载文件。请复制下面的全部内容，保存成文本文件“${esc(name)}”。</p><textarea id="cp-t" class="input mono" rows="12" readonly>${esc(text)}</textarea>`,
    foot: `<button class="btn" data-close>关闭</button><button class="btn primary" id="cp-ok">${icon('copy')}复制全部</button>`,
    onMount(w) {
      w.querySelector('#cp-ok').addEventListener('click', async () => {
        const ta = w.querySelector('#cp-t');
        try { await navigator.clipboard.writeText(text); toast('已复制，粘贴到文本文件里保存即可'); }
        catch (e) { ta.focus(); ta.select(); toast('已选中全部内容，请按 Ctrl+C 复制'); }
      });
    }
  });
  return false;
}
async function exportJSON() {
  const T = realState();
  const data = { app: 'cpa-study-ledger', schema: 1, exportedAt: new Date().toISOString(), data: { ...clone(T), active: null } };
  const ok = await saveFile(`CPA计时簿备份-${calToday()}.json`, JSON.stringify(data, null, 1), 'application/json');
  if (ok && !UI.demo) commit('', s => { s.settings.lastBackup = Date.now(); }, { undoable: false });
}
async function exportCSV() {
  const q = v => { const t = String(v ?? ''); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const rows = [['学习日', '开始', '结束', '课程', '类型', 'Case 建议时长(分钟)', '目标(分钟)', '实际(分钟)', '实际(小时)', '名称', '备注', '来源']];
  for (const s of sessionsLive()) rows.push([dayKey(s.start), hhmm(s.start), hhmm(s.end), courseName(s.courseId), s.mode === 'down' ? 'Case 练习' : '自由学习', s.caseType ?? '', s.target ?? '', mins(s.dur), (s.dur / 3600).toFixed(2), s.title, s.note, s.src === 'manual' ? '补录' : '计时']);
  await saveFile(`CPA学习记录-${calToday()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}
function parseBackup(txt) {
  let j;
  try { j = JSON.parse(txt); } catch (e) { return { err: '内容不是有效的 JSON，请确认复制完整' }; }
  const d = j && j.data ? j.data : j;
  if (!d || typeof d !== 'object' || (!d.sessions && !d.courses)) return { err: '没有找到计时簿数据（缺少 sessions / courses）' };
  return { data: migrate({ ...d, active: null }) };
}
function applyImport(m, mode) {
  let added = 0;
  const e = commit(mode === 'replace' ? '导入备份（替换）' : '导入备份（合并）', s => {
    if (mode === 'replace') {
      const keep = s.active;
      Object.assign(s, clone(m)); s.active = keep;
      added = Object.keys(m.sessions).length;
    } else {
      for (const c of m.courses) if (!s.courses.some(x => x.id === c.id)) s.courses.push(c);
      for (const [id, x] of Object.entries(m.sessions)) if (!s.sessions[id]) { s.sessions[id] = x; added++; }
      for (const c of m.countdowns) if (!s.countdowns.some(x => x.id === c.id)) s.countdowns.push(c);
      s.caseTypes = [...new Set([...s.caseTypes, ...m.caseTypes])].sort((a, b) => a - b);
      for (const [k, v] of Object.entries(m.notes)) if (!s.notes[k]) s.notes[k] = v;
    }
  }, { timer: false });
  applyTheme();
  toast(mode === 'replace' ? `已用备份替换，共 ${added} 条记录` : `已合并，新增 ${added} 条记录`, { action: '撤销', fn: () => undoEntry(e) });
}
function importModal() {
  if (UI.demo) { toast('示例模式下不能导入，请先退出示例'); return; }
  const ent = Modal.open({
    title: '导入备份',
    body: `<p class="muted sm">选择之前导出的 .json 备份文件，或者把备份内容粘贴到下面。</p>
      <label class="f"><span>备份文件</span><input id="im-file" type="file" accept=".json,application/json,text/plain" class="input" style="padding:7px 10px;height:auto"></label>
      <label class="f"><span>或者粘贴内容</span><textarea id="im-text" class="input mono" rows="5" placeholder='{"app":"cpa-study-ledger", ...}'></textarea></label>
      <div class="f"><span>导入方式</span>
        <label class="radio"><input type="radio" name="im-mode" value="merge" checked><span><b>合并</b>：保留现有记录，只加入备份里没有的记录</span></label>
        <label class="radio"><input type="radio" name="im-mode" value="replace"><span><b>替换</b>：用备份覆盖现有数据（之后仍可撤销）</span></label></div>
      <p class="err" id="im-err" hidden></p>`,
    foot: `<button class="btn" data-close>取消</button><button class="btn primary" id="im-ok">导入</button>`,
    onMount(w) {
      const q = id => w.querySelector('#' + id);
      q('im-file').addEventListener('change', async e => { const f = e.target.files[0]; if (f) q('im-text').value = await f.text(); });
      q('im-ok').addEventListener('click', () => {
        const r = parseBackup(q('im-text').value.trim());
        if (r.err) { q('im-err').textContent = r.err; q('im-err').hidden = false; return; }
        const mode = w.querySelector('input[name="im-mode"]:checked').value;
        Modal.close(ent); applyImport(r.data, mode);
      });
    }
  });
}

function makeDemo() {
  let seed = 20261022;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const d = DEFAULT(); d.settings = { ...S.settings };
  d.courses = [{ id: 'x1', name: 'FR（示例）', color: 0, archived: false }, { id: 'x2', name: 'MA（示例）', color: 1, archived: false }, { id: 'x3', name: 'Tax（示例）', color: 2, archived: false }];
  const tk = todayKey(), now = Date.now();
  const add = (k, hh, min, cid, extra = {}) => {
    const start = composeStart(k, `${pad(hh)}:${pad(Math.floor(rnd() * 50))}`); if (start + min * 60000 > now) return;
    const id = 'x' + Math.floor(rnd() * 1e9).toString(36) + Object.keys(d.sessions).length;
    d.sessions[id] = { id, courseId: cid, start, end: start + min * 60000, dur: min * 60, mode: 'up', caseType: null, target: null, title: '', note: '', src: 'timer', created: start, updated: start, ...extra };
  };
  for (let i = 44; i >= 0; i--) {
    const k = addDays(tk, -i);
    if (rnd() < 0.12) continue;
    let hh = 8 + Math.floor(rnd() * 2);
    const n = 1 + Math.floor(rnd() * 3);
    for (let j = 0; j < n; j++) { const min = 40 + Math.floor(rnd() * 120); add(k, hh, min, ['x1', 'x2', 'x3'][Math.floor(rnd() * 3)]); hh += 2 + Math.floor(min / 60); }
  }
  [196, 171, 160, 141, 130, 118, 106, 97, 93, 84, 79, 74].forEach((m, i) => add(addDays(tk, -42 + i * 3 + 2), 20, m, i % 2 ? 'x1' : 'x2', { mode: 'down', caseType: 60, target: i < 4 ? 90 : 75, title: `Case ${i + 1}` }));
  [262, 238, 205, 191, 168, 152].forEach((m, i) => add(addDays(tk, -38 + i * 6 + 3), 19, m, 'x1', { mode: 'down', caseType: 120, target: 150, title: `综合 Case ${i + 1}` }));
  d.countdowns = [{ id: 'xd1', title: '模块考试（示例）', date: addDays(calToday(), 38), color: 0, note: '', created: now - 30 * DAYMS }, { id: 'xd2', title: '报名截止（示例）', date: addDays(calToday(), 9), color: 1, note: '', created: now - 10 * DAYMS }];
  d.pinned = 'xd1';
  return d;
}

  'export-csv': () => exportCSV(),
  import: () => importModal(),
  'local-backup-merge': () => { let raw = null; try { raw = localStorage.getItem(LSKEY + '-local-backup'); } catch (e) {} const r = raw && parseBackup(raw); if (!r || r.err) { toast('没有找到本机旧数据'); return; } applyImport(r.data, 'merge'); },
  'clear-all': async () => {
    if (UI.demo) { toast('示例模式下不能清空'); return; }
    const ok = await confirmModal({ title: '清空全部记录？', text: '会删除所有学习记录、倒计日、小结和正在进行的计时，课程和设置保留。关闭页面之前仍可以撤销。建议先导出备份。', ok: '清空', danger: true, typeWord: '清空' });
    if (!ok) return;
    const e = commit('清空全部记录', s => { s.sessions = {}; s.countdowns = []; s.pinned = null; s.active = null; }, { timer: true });
    S.notes = {}; persist(); Wake.off();
    toast('已清空', { action: '撤销', fn: () => undoEntry(e) });
  },
  'sync-info': () => syncInfo(),
  'demo-on': () => demoOn(),
  'demo-off': () => demoOff()
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const f = ACT[t.dataset.act];
  if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.hold');
  if (!b || b.disabled || e.button > 0) return;
  b.classList.add('holding');
  const tm = setTimeout(() => { b.classList.remove('holding'); b.dataset.fired = '1'; if (b.dataset.hold === 'discard') discardTimer('放弃本次计时'); }, 900);
  const end = () => { clearTimeout(tm); b.classList.remove('holding'); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end); };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
});
document.addEventListener('contextmenu', e => { if (e.target.closest('.hold')) e.preventDefault(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'tgt') { const v = Math.round(+t.value); if (v > 0) { UI.draft.target = clamp(v, 1, 1440); if (UI.draft.caseType) UI.draft.targets[UI.draft.caseType] = UI.draft.target; saveUI(); tick(); } }
  else if (t.id === 'case-title') { UI.draft.title = t.value; saveUI(); }
  else if (t.id === 'today-note') { clearTimeout(t._tm); t._tm = setTimeout(() => saveNote(todayKey(), t.value), 600); }
  else if (t.dataset.set === 'volume') { S.settings.volume = +t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'tgt') { setTarget(+t.value || UI.draft.caseType || 60); return; }
  if (t.id === 'today-note') { saveNote(todayKey(), t.value); return; }
  if (t.dataset.ui) {
    const [a, b] = t.dataset.ui.split('.');
    if (b) UI[a][b] = t.value; else UI[a] = t.value;
    if (a === 'rec') UI.recDays = 30;
    saveUI(); render(); return;
  }
  if (t.dataset.courseName) {
    const id = t.dataset.courseName, name = t.value.trim(), c = courseById(id);
    if (!c) return;
    if (!name) { t.value = c.name; return; }
    if (name !== c.name) commit(`重命名课程「${c.name}」`, s => { const x = s.courses.find(y => y.id === id); if (x) x.name = name; });
    return;
  }
  if (t.dataset.set) {
    let k = t.dataset.set, v = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.type === 'num') v = Number(v);
    if (k === 'dailyGoalH') { k = 'dailyGoal'; v = Math.round(clamp(v || 6, 0.5, 20) * 60); }
    if (k === 'checkinMin') v = clamp(Math.round(v) || 60, 1, 1440);
    if (k === 'title') v = String(v).trim().slice(0, 24) || 'CPA 备考计时簿';
    commit('', s => { s.settings[k] = v; }, { undoable: false });
    if (k === 'notify' && v) askNotify();
    if (k === 'wakeLock') syncWake();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && Modal.stack.length) { Modal.close(); return; }
  const tag = e.target.tagName, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && !typing && !Modal.stack.length) {
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
    return;
  }
  if (e.code === 'Space' && !typing && tag !== 'BUTTON' && !Modal.stack.length && UI.view === 'timer' && !e.repeat) {
    e.preventDefault();
    const a = S.active;
    if (!a) startTimer(); else if (isRunning(a)) pauseTimer(); else resumeTimer();
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncWake(); tick(); } });
window.addEventListener('storage', e => {
  if (e.key !== LSKEY || Store.mode !== 'local' || UI.demo || !e.newValue) return;
  try { S = migrate(JSON.parse(e.newValue)); DV++; applyTheme(); render(); syncWake(); } catch (err) {}
});
window.addEventListener('scroll', hideTip, { passive: true });

/* =================== 启动 =================== */
function boot() {
  loadUI();
  const local = Store.load();
  if (local) S = local;
  if (!VIEWS[UI.view]) UI.view = 'timer';
  applyTheme();
  buildChrome();
  render();
  ro.observe($('#view'));
  setInterval(tick, 250);
  syncWake();
  // 请浏览器把本站数据标为“持久”，减少被自动清理的可能
  try { navigator.storage?.persisted?.().then(p => { if (!p) return navigator.storage.persist(); }).catch(() => {}); } catch (e) {}
  Cloud.init();
}
boot();
})();
</script>
</body>
