<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%231d6a51'%2F%3E%3Ctext%20x%3D'32'%20y%3D'45'%20font-size%3D'38'%20font-weight%3D'900'%20text-anchor%3D'middle'%20fill%3D'%23fff'%20font-family%3D'serif'%3E%E7%B0%BF%3C%2Ftext%3E%3C%2Fsvg%3E">
<meta name="theme-color" content="#ecf0e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="计时簿">
<title>CPA 备考计时簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CPA 备考计时：倒计日、分课程累计时长、Case 倒计时与超时续计、进步曲线、每日打卡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
/* Layout: 一本“计时账簿”——顶部索引页签 + 每个视图一张工作纸；桌面端计时盘与侧栏并排，手机端单列 + 底部页签 */
:root{
  color-scheme:light;
  --bg:#ecf0e9; --surface:#fbfcf9; --surface-2:#f1f4ee; --ink:#15201a; --ink-2:#45524a; --muted:#6f7c74;
  --rule:#d8dfd4; --rule-2:#bfc9bb;
  --acc-ledger:#1d6a51; --acc-ink:#24519c; --acc-wine:#8c2c47; --acc-graphite:#3c4650;
  --accent:var(--acc-ledger); --on-accent:#ffffff;
  --red:#b3271f; --amber:#93600b; --good:#1d7a3c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --scrim:rgba(12,18,14,.46);
  --font-display:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --font-body:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 0 rgba(21,32,26,.04),0 14px 34px -22px rgba(21,32,26,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e1411; --surface:#151d19; --surface-2:#1b2520; --ink:#e4ebe6; --ink-2:#b2bfb7; --muted:#83918a;
  --rule:#26312b; --rule-2:#36443c;
  --acc-ledger:#5cb892; --acc-ink:#86aaee; --acc-wine:#e58ba1; --acc-graphite:#b9c3cd;
  --on-accent:#0a130e; --red:#f07a6e; --amber:#e3ab4f; --good:#5cc483;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 18px 40px -24px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1411; --surface:#151d19; --surface-2:#1b2520; --ink:#e4ebe6; --ink-2:#b2bfb7; --muted:#83918a;
  --rule:#26312b; --rule-2:#36443c;
  --acc-ledger:#5cb892; --acc-ink:#86aaee; --acc-wine:#e58ba1; --acc-graphite:#b9c3cd;
  --on-accent:#0a130e; --red:#f07a6e; --amber:#e3ab4f; --good:#5cc483;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 18px 40px -24px rgba(0,0,0,.8);
}
:root[data-accent="ink"]{--accent:var(--acc-ink)}
:root[data-accent="wine"]{--accent:var(--acc-wine)}
:root[data-accent="graphite"]{--accent:var(--acc-graphite)}
:root{
  --accent-soft:color-mix(in oklab,var(--accent) 13%,var(--surface));
  --accent-line:color-mix(in oklab,var(--accent) 45%,var(--rule));
  --red-soft:color-mix(in oklab,var(--red) 12%,var(--surface));
  --amber-soft:color-mix(in oklab,var(--amber) 15%,var(--surface));
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
[hidden]{display:none!important}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.u{font:600 .46em/1 var(--font-body);color:var(--muted);margin:0 .14em 0 .06em;letter-spacing:0;vertical-align:.05em}
.muted{color:var(--muted)}
.sm{font-size:13px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:3px}
kbd{font:600 11px var(--font-num);padding:1px 6px;border-radius:5px;border:1px solid var(--rule-2);border-bottom-width:2px;background:var(--surface);color:var(--ink-2)}

/* ---------- top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in oklab,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.2) blur(12px);backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid var(--rule)}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.logo{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:900 18px/1 var(--font-display);box-shadow:inset 0 -2px 0 rgba(0,0,0,.16)}
.brand h1{font:700 18px/1.2 var(--font-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{display:flex;gap:2px;margin-left:10px}
.tab{position:relative;display:inline-flex;align-items:center;gap:7px;height:62px;padding:0 12px;border:0;background:none;color:var(--ink-2);font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.cd-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--rule-2);background:var(--surface);cursor:pointer;white-space:nowrap;font-size:13px;color:var(--ink-2);margin-right:4px}
.cd-chip b{font:900 17px/1 var(--font-display);color:var(--accent)}
.cd-chip .cd-t{max-width:12em;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap}
.sync:hover{background:var(--surface-2)}
.sync[data-s="synced"] .i{color:var(--accent)}
.sync[data-s="error"]{color:var(--red)}
.sync[data-s="syncing"] .i,.sync[data-s="connecting"] .i{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.demo-bar{background:var(--amber-soft);border-bottom:1px solid color-mix(in oklab,var(--amber) 35%,var(--rule))}
.demo-bar .wrap{display:flex;align-items:center;gap:12px;min-height:44px;font-size:13.5px;flex-wrap:wrap;padding-block:6px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;justify-content:space-around;background:color-mix(in oklab,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--rule);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;border-radius:10px;min-width:0}
.bn .i{width:21px;height:21px}
.bn[aria-current="page"]{color:var(--accent)}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:color-mix(in oklab,var(--accent) 88%,var(--ink))}
.btn.danger{color:var(--red);border-color:color-mix(in oklab,var(--red) 35%,var(--rule-2))}
.btn.danger:hover{background:var(--red-soft)}
.btn.danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{width:38px;padding:0}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.icon.sm{width:32px;padding:0}
.btn.xl{height:54px;padding:0 26px;font-size:16px;border-radius:14px}
.btn.xl .i{width:20px;height:20px}
.hold{position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.hold::after{content:"";position:absolute;inset:0;background:color-mix(in oklab,var(--red) 24%,transparent);transform:scaleX(0);transform-origin:left;pointer-events:none}
.hold.holding::after{transform:scaleX(1);transition:transform .9s linear}
.input{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--rule-2);background:var(--surface);width:100%;min-width:0}
textarea.input{height:auto;padding:9px 12px;resize:vertical;line-height:1.5}
select.input{padding-right:30px}
.input.sm{height:34px;font-size:13.5px;width:auto}
.input:focus{outline:2px solid color-mix(in oklab,var(--accent) 55%,transparent);outline-offset:1px;border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--rule-2);background:var(--surface);cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px;max-width:100%}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.add{border-style:dashed;color:var(--muted)}
.seg-sm{display:inline-flex;padding:3px;gap:2px;border-radius:10px;background:var(--surface-2);border:1px solid var(--rule)}
.seg-sm button{height:30px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--ink-2);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.seg-sm button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule-2),0 1px 2px rgba(0,0,0,.06)}
.tog{appearance:none;-webkit-appearance:none;margin:0;width:44px;height:26px;border-radius:99px;background:var(--rule-2);cursor:pointer;transition:background .2s;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.tog:checked{background:var(--accent)}
.tog:checked::after{transform:translateX(18px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--rule-2);background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

/* ---------- page ---------- */
#view{padding-block:26px 72px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.vh h2{font:700 26px/1.25 var(--font-display);letter-spacing:.01em}
.vh p{margin-top:4px;font-size:14px}
.vh-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:20px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-h h3{font:700 16px/1.3 var(--font-display)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.panel{margin-top:26px;min-width:0}
.panel-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-h h3{font:700 19px/1.3 var(--font-display)}
.panel-h p{font-size:13.5px;margin-top:2px}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;min-width:0}
.empty{text-align:center;padding:44px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font:700 20px var(--font-display)}
.empty p{max-width:36em;color:var(--ink-2)}
.empty-sm{padding:18px;border:1px dashed var(--rule-2);border-radius:12px;color:var(--ink-2);font-size:14px;text-align:center}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13.5px;background:var(--surface-2);border:1px solid var(--rule)}
.note.warn{background:var(--amber-soft);border-color:color-mix(in oklab,var(--amber) 35%,var(--rule))}
.err{color:var(--red);font-size:13.5px;font-weight:600}

/* ---------- timer ---------- */
.timer-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.timer-card{padding:22px 24px 26px;box-shadow:var(--shadow)}
.setup{display:flex;flex-direction:column;gap:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px}
.seg button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 14px;border:0;border-radius:9px;background:transparent;cursor:pointer;text-align:left;color:var(--ink-2);min-width:0}
.seg button b{font-weight:700;color:var(--ink);font-size:15px}
.seg button span{font-size:12.5px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--rule-2),0 2px 6px -2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.lbl em,.f>span em{font-style:normal;color:var(--muted);font-weight:400}
.field-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.stepper{display:inline-flex;align-self:flex-start;align-items:center;border:1px solid var(--rule-2);border-radius:10px;overflow:hidden;background:var(--surface);height:40px}
.stepper button{width:40px;height:100%;border:0;background:var(--surface-2);cursor:pointer;font:600 14px var(--font-num);color:var(--ink-2)}
.stepper button:hover{color:var(--ink);background:var(--rule)}
.stepper input{width:58px;height:100%;border:0;text-align:center;font:600 18px var(--font-num);background:transparent;padding:0}
.stepper input:focus{outline:none;background:var(--accent-soft)}
.stepper .unit{padding:0 10px 0 2px;color:var(--muted);font-size:13px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qbtn{height:28px;padding:0 10px;border-radius:7px;border:1px dashed var(--rule-2);background:none;color:var(--ink-2);font-size:12.5px;cursor:pointer;font-weight:600}
.qbtn:hover{border-style:solid;color:var(--ink)}
.active-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--rule)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-size:13px;font-weight:600;max-width:100%;min-width:0}
.pill .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
[data-state~="running"] .state-dot{animation:pulse 1.6s ease-out infinite}
[data-state~="paused"] .state-dot{background:var(--amber)}
[data-state~="over"] .state-dot{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.state-pill{color:var(--accent)}
[data-state~="paused"] .state-pill{color:var(--amber)}
[data-state~="over"] .state-pill{color:var(--red)}
.active-sum .ttl{font-size:13.5px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 120px}
.dial{position:relative;width:min(100%,336px);aspect-ratio:1;margin:24px auto 16px}
.dial svg{display:block;width:100%;height:100%;overflow:visible}
.dial .tk{stroke:var(--rule-2);stroke-width:1.2}
.dial .tk.l{stroke:var(--muted);stroke-width:1.8}
.dial .face{stroke:var(--rule);stroke-width:1}
.dial .track{fill:none;stroke:color-mix(in oklab,var(--rule) 55%,var(--surface-2));stroke-width:13}
.dial .prog{fill:none;stroke:var(--accent);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .3s}
.dial .over{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.dial .cmark line{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.dial .cmark text{fill:var(--ink-2);font:600 11px var(--font-num)}
[data-state~="warn"] .dial .prog{stroke:var(--amber)}
[data-state~="over"] .dial .prog{stroke:color-mix(in oklab,var(--red) 35%,var(--surface-2))}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 17%}
.readout .label{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.readout .digits{font:500 clamp(36px,10.5vw,58px)/1.08 var(--font-num);letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:6px 0 6px;white-space:nowrap}
.readout .sub{font-size:12.5px;color:var(--ink-2)}
[data-state~="over"] .readout .digits,[data-state~="over"] .readout .label{color:var(--red)}
[data-state~="over"] .readout .digits{font-size:clamp(34px,9.5vw,54px)}
[data-state~="warn"] .readout .digits{color:var(--amber)}
[data-state~="paused"] .readout .digits{opacity:.5}
.dial.flash{animation:flash 1.2s ease-out 2}
@keyframes flash{0%{transform:scale(1)}15%{transform:scale(1.03)}30%{transform:scale(1)}}
.controls{display:flex;flex-direction:column;align-items:center;gap:12px}
.ctl-main{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.ctl-main .btn.xl{flex:1 1 0;max-width:220px;min-width:0;padding:0 14px}
.ctl-main .btn.primary{box-shadow:0 12px 26px -14px color-mix(in oklab,var(--accent) 80%,transparent),inset 0 -2px 0 rgba(0,0,0,.14)}
.active-sum .btn{margin-left:auto}
.ctl-sub{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hint{font-size:12px;color:var(--muted)}
.grace{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--amber-soft);font-size:13.5px;flex-wrap:wrap;text-align:center}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.today-total{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.today-total .big{font:500 38px/1 var(--font-num);letter-spacing:-.02em}
.goalbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:12px 0 7px;border:1px solid var(--rule)}
.goalbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.goal-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.goal-meta b{color:var(--ink)}
.ok-txt{color:var(--good);font-weight:700}
.crows{list-style:none;margin:12px 0 0;padding:0}
.crows li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);font-size:14px}
.crows .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crows .num{font-size:13.5px}
.grand{display:flex;align-items:baseline;gap:6px}
.grand .num{font:500 38px/1 var(--font-num);letter-spacing:-.02em}
.grand .u{color:var(--muted);font-size:14px}
.live-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:10px}
.recent li{grid-template-columns:auto minmax(0,1fr) auto auto}
.recent .t{font-size:12.5px;color:var(--muted)}
.onboard{background:var(--accent-soft);border-color:var(--accent-line)}
.backup-card{background:var(--amber-soft);border-color:color-mix(in oklab,var(--amber) 35%,var(--rule))}
.onboard ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}

/* ---------- countdown days ---------- */
.cd-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end;padding:26px 28px;border-radius:18px;background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow)}
.cd-hero .t{font:700 22px/1.3 var(--font-display);display:flex;align-items:center;gap:10px;min-width:0}
.cd-hero .t span{overflow:hidden;text-overflow:ellipsis}
.cd-hero .meta{color:var(--ink-2);margin-top:6px;font-size:14px}
.cd-hero .note-t{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:40em}
.cd-big{display:flex;align-items:baseline;gap:6px;justify-self:end}
.cd-big b{font:900 clamp(72px,15vw,140px)/.86 var(--font-display);color:var(--c,var(--accent));letter-spacing:-.03em}
.cd-big span{font:700 22px var(--font-display);color:var(--ink-2)}
.cd-prog{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.cd-prog .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px}
.cd-actions{display:flex;gap:4px;margin-left:auto;flex:none}
.cd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.cd-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cd-card .top{display:flex;align-items:center;gap:8px;min-width:0}
.cd-card .top h4{font:700 16px/1.3 var(--font-display);min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
.cd-card .n{display:flex;align-items:baseline;gap:5px}
.cd-card .n b{font:900 48px/.95 var(--font-display);color:var(--c,var(--accent))}
.cd-card .n span{font:700 15px var(--font-display);color:var(--ink-2)}
.cd-card .meta{font-size:13px;color:var(--ink-2)}
.cd-card.past{opacity:.7}
.cd-card.past .n b{color:var(--muted)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{padding:16px 18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--rule);min-width:0}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.tile .v{font:500 27px/1.15 var(--font-num);margin-top:6px;letter-spacing:-.02em;white-space:nowrap}
.tile .v small{font:500 13px var(--font-body);color:var(--muted);margin-left:4px;letter-spacing:0}
.tile .s{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.tile.hero{background:var(--accent-soft);border-color:var(--accent-line)}
.tile.hero .v{font:900 34px/1.1 var(--font-display);letter-spacing:0}
.cbars{display:flex;flex-direction:column}
.cbar{display:grid;grid-template-columns:minmax(80px,180px) minmax(0,1fr) 78px 70px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.cbar:last-child{border-bottom:0}
.cbar .nm{display:flex;align-items:center;gap:8px;min-width:0}
.cbar .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .tr{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cbar .tr i{display:block;height:100%;background:var(--c);border-radius:99px}
.cbar .v{text-align:right;font-weight:600}
.cbar .r{text-align:right;color:var(--muted);font-size:13px}
.cbar.head{font-size:12px;color:var(--muted);font-weight:700;padding-top:0}
.cbar.head .tr{background:none}
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;max-width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .base{stroke:var(--rule-2);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 11px var(--font-num)}
.chart .axl{fill:var(--muted);font:600 11px var(--font-body)}
.chart .goal{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:5 4}
.chart .goal-t{fill:var(--ink-2);font:700 11px var(--font-body)}
.chart .goal-t,.chart .ref-t,.chart .pt-l{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .hl{fill:var(--ink);opacity:0}
.chart .hl.on{opacity:.06}
.chart .xh{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.chart .xh.on{opacity:.7}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.09}
.chart .tline{fill:none;stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:1.5 4;stroke-linecap:round}
.chart .ref{stroke:var(--muted);stroke-width:1.3;stroke-dasharray:7 5}
.chart .ref-t{fill:var(--muted);font:700 11px var(--font-body)}
.chart .pt-l{fill:var(--ink);font:600 12px var(--font-num)}
.chart .pt{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend svg{width:22px;height:10px;overflow:visible}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ctabs button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--rule-2);background:var(--surface);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.ctabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ctabs .cnt{font:600 11.5px var(--font-num);opacity:.7}
.case-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px 18px;padding:14px 0 16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:14px}
.case-sum div{display:flex;flex-direction:column;gap:2px;min-width:0}
.case-sum span{font-size:12px;color:var(--muted);font-weight:700}
.case-sum b{font:600 19px var(--font-num);white-space:nowrap}
.case-sum b small{font:500 12px var(--font-body);color:var(--muted);margin-left:3px}
.good-t{color:var(--good)}
.tbl-wrap{overflow-x:auto;margin-top:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--ink-2)}
.tbl td{padding:8px;border-bottom:1px solid var(--rule)}
.tbl .r{text-align:right}
.tbl td.num,.tbl th.r{font-variant-numeric:tabular-nums}
.delta{font:600 12.5px var(--font-num);padding:1px 7px;border-radius:6px;white-space:nowrap}
.delta.over{color:var(--red);background:var(--red-soft)}
.delta.ok{color:var(--good);background:color-mix(in oklab,var(--good) 12%,var(--surface))}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:80;pointer-events:none;min-width:150px;max-width:270px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.5;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.tip b{font-weight:700}
.tip .r{display:flex;align-items:center;gap:8px}
.tip .r i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.tip .r .v{margin-left:auto;font-family:var(--font-num);padding-left:12px}
.tip .tot{border-top:1px solid color-mix(in oklab,var(--surface) 30%,transparent);margin-top:5px;padding-top:5px;display:flex;justify-content:space-between;font-weight:700}

/* ---------- check-in ---------- */
.ck-top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.ck-today{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.ck-big{font:500 52px/1 var(--font-num);letter-spacing:-.03em;margin-top:8px}
.ck-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;align-content:center}
.ck-stats div{display:flex;flex-direction:column;gap:2px}
.ck-stats span{font-size:12.5px;color:var(--muted);font-weight:700}
.ck-stats b{font:600 26px/1.1 var(--font-num)}
.ck-stats b small{font:500 13px var(--font-body);color:var(--muted);margin-left:3px}
.stamp{--sz:118px;width:var(--sz);height:var(--sz);border-radius:50%;border:3px solid var(--red);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4.5px var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);font-family:var(--font-display);opacity:.92;flex:none}
.stamp .s1{font-weight:900;font-size:25px;letter-spacing:.14em;margin-left:.14em}
.stamp .s2{font:600 10.5px var(--font-num);letter-spacing:.06em;margin-top:3px}
.stamp.anim{animation:stamp .6s cubic-bezier(.2,1.5,.45,1) both}
@keyframes stamp{0%{opacity:0;transform:rotate(-26deg) scale(1.9)}60%{opacity:1;transform:rotate(-10deg) scale(.94)}100%{opacity:.92;transform:rotate(-12deg) scale(1)}}
.stamp.empty{border:2px dashed var(--rule-2);box-shadow:none;color:var(--muted);transform:none;opacity:1}
.stamp.empty .s1{font-size:18px;font-weight:700}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-h h4{font:700 17px var(--font-display);min-width:7.5em;text-align:center}
.cal-h .sum{margin-left:auto;font-size:13px;color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal .day{position:relative;min-height:66px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;min-width:0}
.cal .day:hover{border-color:var(--ink-2)}
.cal .day .n{font:600 13px var(--font-num);color:var(--ink-2)}
.cal .day .h{font:600 12.5px var(--font-num);color:var(--ink)}
.cal .day .h i{font-style:normal;font-weight:500;color:var(--ink-2)}
.cal .day.lv1{background:color-mix(in oklab,var(--accent) 10%,var(--surface))}
.cal .day.lv2{background:color-mix(in oklab,var(--accent) 22%,var(--surface))}
.cal .day.lv3{background:color-mix(in oklab,var(--accent) 36%,var(--surface))}
.cal .day.lv4{background:color-mix(in oklab,var(--accent) 52%,var(--surface))}
.cal .day.out{opacity:.38}
.cal .day.future{cursor:default;background:transparent;border-style:dashed}
.cal .day.today{box-shadow:0 0 0 2px var(--accent)}
.cal .mk{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--red);color:var(--red);font:900 10px/15px var(--font-display);text-align:center;transform:rotate(-12deg);background:var(--surface)}
.hm svg{display:block;max-width:100%;height:auto}
.hm .hc{cursor:pointer}
.hm .lv0{fill:var(--surface-2);stroke:var(--rule);stroke-width:1}
.hm .lv1{fill:color-mix(in oklab,var(--accent) 24%,var(--surface))}
.hm .lv2{fill:color-mix(in oklab,var(--accent) 46%,var(--surface))}
.hm .lv3{fill:color-mix(in oklab,var(--accent) 70%,var(--surface))}
.hm .lv4{fill:var(--accent)}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:flex-end;flex-wrap:wrap}
.hm-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- records ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rec-sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:12px 4px;margin-bottom:8px;font-size:14px;color:var(--ink-2)}
.rec-sum b{font:600 17px var(--font-num);color:var(--ink);text-decoration:underline double;text-underline-offset:5px;text-decoration-thickness:1px}
.lg-day{margin-bottom:22px}
.lg-dh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 6px 6px;border-bottom:1.5px solid var(--ink-2)}
.lg-dh .d{font:700 15px var(--font-display)}
.lg-dh .d small{font:500 12.5px var(--font-body);color:var(--muted);margin-left:8px}
.lg-dh .sum{font:600 15px var(--font-num);text-decoration:underline double;text-underline-offset:5px;text-decoration-thickness:1px}
.lg-row{display:grid;grid-template-columns:112px minmax(0,1fr) minmax(0,1.6fr) 64px 76px;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--rule);font-size:14px}
.lg-row:hover{background:var(--surface-2)}
.lg-row .t{color:var(--ink-2);font-size:13px;white-space:nowrap}
.lg-row .c{display:flex;align-items:center;gap:8px;min-width:0}
.lg-row .c span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-row .k{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.lg-row .ttl{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.lg-row .nt{color:var(--muted);font-size:12.5px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-row .du{text-align:right;font-weight:600}
.lg-row .a{display:flex;justify-content:flex-end;gap:2px}
.ktag{display:inline-flex;align-items:center;height:22px;font-size:12px;padding:0 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--rule);font-weight:700;color:var(--ink-2);white-space:nowrap}
.ktag.case{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

/* ---------- settings ---------- */
.set-sec{padding:22px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:14px 36px}
.set-sec:first-of-type{border-top:0;padding-top:4px}
.set-sec h3{font:700 17px/1.3 var(--font-display)}
.set-sec .desc{font-size:13px;color:var(--muted);margin-top:4px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed var(--rule);flex-wrap:wrap}
.srow:last-child{border-bottom:0}
.srow .sl{min-width:0;flex:1 1 220px}
.srow .sl b{display:block;font-weight:600;font-size:14.5px}
.srow .sl span{display:block;font-size:12.5px;color:var(--muted)}
.srow .sc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srow .input{width:auto}
.inp-num{width:86px!important;text-align:right;font-family:var(--font-num)}
.course-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--rule)}
.course-row.arch{opacity:.6}
.course-row .tt{font:500 13px var(--font-num);color:var(--muted);white-space:nowrap;padding:0 4px}
.course-row .ops{display:flex;gap:2px}
.add-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add-row .input{flex:1 1 160px;width:auto}
.ct-chip{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 6px 0 13px;border-radius:999px;border:1px solid var(--rule-2);background:var(--surface);font:600 13.5px var(--font-num)}
.ct-chip button{width:24px;height:24px;border-radius:50%;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.ct-chip button:hover{background:var(--red-soft);color:var(--red)}
.ct-chip .i{width:14px;height:14px}
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;align-items:center}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .15s ease-out}
.modal{position:relative;width:min(560px,100%);max-height:min(90vh,880px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 30px 80px -24px rgba(0,0,0,.5);animation:pop .18s ease-out;outline:none}
.modal.wide{width:min(720px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 8px 20px}
.modal header h3{font:700 19px/1.3 var(--font-display)}
.m-body{padding:6px 20px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--rule)}
.modal footer .left{margin-right:auto}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.dur-in{display:flex;align-items:center;gap:6px}
.dur-in .input{width:64px;text-align:right;font-family:var(--font-num);padding:0 10px}
.dur-in b{font-weight:600;font-size:13.5px;color:var(--ink-2)}
.finish-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--rule);flex-wrap:wrap}
.finish-hero .fh-t{font:500 40px/1 var(--font-num);letter-spacing:-.03em;margin-top:4px}
.finish-hero .fh-side{font-size:13.5px;color:var(--ink-2);text-align:right}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.radio input{margin-top:4px;accent-color:var(--accent)}
.mono{font-family:var(--font-num);font-size:12.5px}
.day-list{list-style:none;margin:0;padding:0}
.day-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.day-list .t{font:500 12.5px var(--font-num);color:var(--muted)}
.day-list .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-tot{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.day-tot b{font:500 30px var(--font-num)}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(540px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 9px 9px 16px;border-radius:12px;background:var(--ink);color:var(--surface);box-shadow:0 14px 34px -10px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;font-size:14px;max-width:100%}
.toast.in{opacity:1;transform:none}
.toast .tx{flex:1;min-width:0}
.toast .t-act{border:0;background:color-mix(in oklab,var(--surface) 20%,transparent);color:inherit;font-weight:700;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.toast .t-x{border:0;background:none;color:inherit;opacity:.6;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;padding:0}
.toast.over{background:var(--red);color:#fff}
.toast.stamp-t{background:var(--surface);color:var(--red);border:2px solid var(--red);font-weight:700}

/* ---------- responsive ---------- */
@media (max-width:1060px){.sync span{display:none}.cd-chip .cd-t{display:none}}
@media (max-width:900px){.timer-layout,.ck-top{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .tabs{display:none}
  .bottomnav{display:flex}
  #view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:760px){
  .set-sec{grid-template-columns:minmax(0,1fr)}
  .lg-row{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"c du a" "k k k" "t t t";row-gap:4px;column-gap:8px}
  .lg-row .c{grid-area:c}.lg-row .du{grid-area:du}.lg-row .a{grid-area:a}.lg-row .k{grid-area:k}.lg-row .t{grid-area:t;font-size:12px}
  .cbar{grid-template-columns:minmax(0,1fr) 62px 54px;grid-template-areas:"nm v r" "tr tr tr";row-gap:6px;column-gap:8px}
  .cbar .nm{grid-area:nm}.cbar .tr{grid-area:tr}.cbar .v{grid-area:v}.cbar .r{grid-area:r}

}
@media (max-width:560px){

  .brand h1{font-size:15.5px}

  .cd-chip{padding:0 10px;margin-right:0}
  .cd-hero{grid-template-columns:minmax(0,1fr);padding:20px}
  .cd-big{justify-self:start}
  .ck-today{grid-template-columns:minmax(0,1fr)}
  .ck-today .stamp{justify-self:center}
  .cal{gap:4px}
  .cal .day{min-height:52px;padding:4px 5px}
  .cal .day .h{font-size:11px}
  .cal .mk{width:7px;height:7px;font-size:0;border:0;background:var(--red);top:6px;right:5px;transform:none}
  .cal .day .h{font-size:10.5px;letter-spacing:-.02em}
  .course-row{grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"sw nm nm" ". tt ops";row-gap:2px}
  .course-row .sw{grid-area:sw}.course-row .input{grid-area:nm}.course-row .tt{grid-area:tt;padding:0}.course-row .ops{grid-area:ops}
  .sync{display:none}
  .modal-wrap{place-items:end center;padding:0}
  .modal{width:100%;border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}

  .vh h2{font-size:23px}
}

<body>
<div class="topbar"><div class="wrap topbar-in">
  <button class="brand" data-act="go" data-v="timer" aria-label="回到计时"><span class="logo" aria-hidden="true">簿</span><h1 id="app-title">CPA 备考计时簿</h1></button>
  <nav class="tabs" id="tabs" aria-label="主导航"></nav>
  <div class="top-actions">
    <button class="cd-chip" id="cd-chip" data-act="go" data-v="days" hidden></button>
    <button class="sync" id="sync" data-act="sync-info" data-s="local"></button>
    <button class="btn icon ghost" id="undo-btn" data-act="undo" aria-label="撤销"></button>

</div></div>

<script>
(function () {
'use strict';

/* =================== 工具 =================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
const pad = n => String(n).padStart(2, '0');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pct = (a, b) => (b > 0 ? clamp((a / b) * 100, 0, 100) : 0);
const DAYMS = 864e5;
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const MINUS = '−';

function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function hms(sec) { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 3600)}:${pad(Math.floor((sec % 3600) / 60))}:${pad(sec % 60)}`; }
function hm(sec) { const m = Math.round(Math.max(0, sec) / 60), h = Math.floor(m / 60), mm = m % 60; return h ? (mm ? `${h}h${pad(mm)}m` : `${h}h`) : `${mm}m`; }
function hmRich(sec) { const m = Math.round(Math.max(0, sec) / 60), h = Math.floor(m / 60), mm = m % 60, u = t => `<small class="u">${t}</small>`; return h ? `${h}${u('h')}${mm ? pad(mm) + u('m') : ''}` : `${mm}${u('m')}`; }
const hShort = sec => (sec < 3600 ? `${Math.round(sec / 60)}m` : `${(sec / 3600).toFixed(1)}h`);
function hmText(sec) { const m = Math.round(Math.max(0, sec) / 60), h = Math.floor(m / 60), mm = m % 60; return h ? (mm ? `${h} 小时 ${mm} 分` : `${h} 小时`) : `${mm} 分钟`; }
const hours1 = sec => (sec / 3600).toFixed(1);
const mins = sec => Math.round(sec / 60);
function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function keyDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n) { const d = keyDate(k); d.setDate(d.getDate() + n); return toKey(d); }
function diffDays(a, b) { return Math.round((keyDate(b) - keyDate(a)) / DAYMS); }
function dayKey(ms) { return toKey(new Date(ms - (S.settings.dayStartHour || 0) * 36e5)); }
const todayKey = () => dayKey(Date.now());
const calToday = () => toKey(new Date());
function mondayOf(k) { const d = keyDate(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toKey(d); }
function md(k) { const d = keyDate(k); return `${d.getMonth() + 1}月${d.getDate()}日`; }
function mdw(k) { const d = keyDate(k); return `${d.getMonth() + 1}月${d.getDate()}日 周${WD[d.getDay()]}`; }
function ymd(k) { const d = keyDate(k); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 周${WD[d.getDay()]}`; }
function hhmm(ms) { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function monthKey(ms) { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function composeStart(date, time) {
  const [y, mo, d] = date.split('-').map(Number), [hh, mm] = time.split(':').map(Number);
  const dt = new Date(y, mo - 1, d, hh, mm, 0, 0);
  if (hh < (S.settings.dayStartHour || 0)) dt.setDate(dt.getDate() + 1);
  return dt.getTime();
}

const ICONS = {
  timer: '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.3 2.3M9.5 2.5h5M12 2.5V6"/>',
  flag: '<path d="M5.5 21V4"/><path d="M5.5 4.5H17l-2.2 4 2.2 4H5.5"/>',
  chart: '<path d="M3 20.5h18"/><path d="M6.5 17v-6M11 17V5.5M15.5 17v-8M20 17v-4"/>',
  check: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="m9 14.8 2 2 4-4"/>',
  list: '<path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.8"/>',
  gear: '<path d="M4 6h9M18 6h2M4 12h3M12 12h8M4 18h11M20 18h0"/><circle cx="15.5" cy="6" r="2.2"/><circle cx="9.5" cy="12" r="2.2"/><circle cx="17.5" cy="18" r="2.2"/>',
  undo: '<path d="M9 14.5 4 9.5l5-5"/><path d="M4 9.5h10.5a5.5 5.5 0 0 1 0 11H10"/>',
  redo: '<path d="m15 14.5 5-5-5-5"/><path d="M20 9.5H9.5a5.5 5.5 0 0 0 0 11H14"/>',
  cloud: '<path d="M7 18.5h10.5a4.5 4.5 0 0 0 .4-8.98A6 6 0 0 0 6.3 10.6 4 4 0 0 0 7 18.5z"/>',
  device: '<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/>',
  play: '<path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/>',
  pause: '<path d="M9 5.5v13M15 5.5v13" stroke-width="2.6"/>',
  stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  edit: '<path d="M4.5 19.5h4l10-10-4-4-10 10z"/><path d="m13 7 4 4"/>',
  trash: '<path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.9 12.5h9.2L17.5 7M9.5 7V4.5h5V7"/>',
  restore: '<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/>',
  star: '<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  starF: '<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="currentColor"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  down: '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/>',
  up: '<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 20h14"/>',
  bell: '<path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 1.5h-14z"/><path d="M10 20.5h4"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  chevL: '<path d="m14.5 6-6 6 6 6"/>',
  chevR: '<path d="m9.5 6 6 6-6 6"/>',
  arrUp: '<path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/>',
  arrDown: '<path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/>',
  archive: '<rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5V19h14V8.5M10 12.5h4"/>',
  copy: '<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>',
  note: '<path d="M5 4.5h14v15H5z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* =================== 数据 =================== */
const LSKEY = 'cpa-ledger-data-v1', UIKEY = 'cpa-ledger-ui-v1';
const ACCENTS = [['ledger', '账本绿'], ['ink', '墨水蓝'], ['wine', '酒红'], ['graphite', '石墨']];
const DEFAULT = () => ({
  schema: 1,
  settings: { title: 'CPA 备考计时簿', dailyGoal: 360, checkinMin: 60, dayStartHour: 4, graceSec: 120, minRecordSec: 60, warnBefore: 5, sound: true, volume: 0.7, notify: false, wakeLock: true, theme: 'auto', accent: 'ledger', lastBackup: 0, backupEvery: 7 },
  courses: [{ id: 'c1', name: '课程 1', color: 0, archived: false }, { id: 'c2', name: '课程 2', color: 1, archived: false }],
  caseTypes: [60, 120, 180, 240, 360],
  countdowns: [], pinned: null, notes: {}, sessions: {}, active: null
});
function migrate(d) {
  const b = DEFAULT();
  if (!d || typeof d !== 'object') return b;
  const o = {
    schema: 1,
    settings: { ...b.settings, ...(d.settings && typeof d.settings === 'object' ? d.settings : {}) },
    courses: Array.isArray(d.courses) && d.courses.length ? d.courses.filter(c => c && c.id).map(c => ({ id: String(c.id), name: String(c.name || '未命名课程'), color: Number.isFinite(+c.color) ? +c.color % 8 : 0, archived: !!c.archived })) : b.courses,
    caseTypes: Array.isArray(d.caseTypes) ? [...new Set(d.caseTypes.map(Number).filter(n => n > 0 && n <= 1440))].sort((x, y) => x - y) : b.caseTypes,
    countdowns: Array.isArray(d.countdowns) ? d.countdowns.filter(c => c && c.id && c.date) : [],
    pinned: d.pinned ?? null,
    notes: d.notes && typeof d.notes === 'object' && !Array.isArray(d.notes) ? { ...d.notes } : {},
    sessions: {},
    active: d.active && Array.isArray(d.active.segs) ? d.active : null
  };
  const src = Array.isArray(d.sessions) ? d.sessions : Object.values(d.sessions || {});
  for (const s of src) {
    if (!s || !s.id || !Number.isFinite(+s.start) || !Number.isFinite(+s.dur)) continue;
    o.sessions[s.id] = { ...s, start: +s.start, dur: +s.dur, end: Number.isFinite(+s.end) ? +s.end : +s.start + s.dur * 1000, mode: s.mode === 'down' ? 'down' : 'up', caseType: s.caseType ? +s.caseType : null, target: s.target ? +s.target : null, title: s.title || '', note: s.note || '' };
  }
  return o;
}

let S = DEFAULT();
let DV = 0;
let Hist = { undo: [], redo: [] };
const UI = {
  view: 'timer', demo: false, stampAnim: false, themeByApp: false, onboardHidden: false,
  draft: { mode: 'up', courseId: 'c1', caseType: 60, target: 60, title: '', targets: {} },
  statsRange: 30, caseSel: null, caseCourse: 'all',
  rec: { course: 'all', kind: 'all', range: '30' }, recDays: 30,
  calMonth: null
};
function loadUI() {
  try {
    const u = JSON.parse(localStorage.getItem(UIKEY) || 'null');
    if (!u) return;
    if (u.view) UI.view = u.view;
    if (u.statsRange != null) UI.statsRange = u.statsRange;
    if (u.caseCourse) UI.caseCourse = u.caseCourse;
    if (u.caseSel) UI.caseSel = u.caseSel;
    if (u.rec) Object.assign(UI.rec, u.rec);
    if (u.draft) Object.assign(UI.draft, u.draft);
    UI.onboardHidden = !!u.onboardHidden;
    UI.backupSnooze = +u.backupSnooze || 0;
  } catch (e) {}
}
function saveUI() {
  try { localStorage.setItem(UIKEY, JSON.stringify({ view: UI.view, statsRange: UI.statsRange, caseCourse: UI.caseCourse, caseSel: UI.caseSel, rec: UI.rec, draft: UI.draft, onboardHidden: UI.onboardHidden, backupSnooze: UI.backupSnooze })); } catch (e) {}
}

const Store = {
  mode: 'local', localSrc: null, realS: null, realHist: null, quotaWarned: false,
  load() {
    try {
      const raw = localStorage.getItem(LSKEY);
      if (!raw) return null;
      const j = JSON.parse(raw);
      this.localSrc = j._src || 'local';
      return migrate(j);
    } catch (e) { return null; }
  },
  saveLocal() {
    try { localStorage.setItem(LSKEY, JSON.stringify({ ...realState(), _src: this.mode })); }
    catch (e) { if (!this.quotaWarned) { this.quotaWarned = true; toast('浏览器拒绝保存数据（隐私模式或存储已满），请尽快导出备份', { ms: 9000 }); } }
  }
};
const realState = () => (UI.demo ? Store.realS : S);

function commit(label, fn, opt = {}) {
  const undoable = opt.undoable !== false;
  let entry = null;
  if (undoable) { const snap = clone(S); if (opt.patchSnap) opt.patchSnap(snap); entry = { label, snap, timer: !!opt.timer }; }
  fn(S);
  DV++;
  if (entry) { Hist.undo.push(entry); if (Hist.undo.length > 80) Hist.undo.shift(); Hist.redo.length = 0; }
  persist();
  if (opt.render === false) renderChrome(); else render();
  return entry;
}
function persist() {
  if (UI.demo) return;
  Store.saveLocal();
  if (Store.mode === 'cloud') Cloud.sync();
}
function restoreSnap(snap, timer) {
  const n = clone(snap);
  n.settings = S.settings; n.notes = S.notes;
  if (!timer) n.active = S.active;
  S = n;
}
function undo() {
  const e = Hist.undo.pop();
  if (!e) { toast('没有可以撤销的操作'); return; }
  Hist.redo.push({ label: e.label, snap: clone(S), timer: e.timer });
  restoreSnap(e.snap, e.timer); afterHistory();
  toast(`已撤销：${e.label}`, { action: '重做', fn: redo });
}
function redo() {
  const e = Hist.redo.pop();
  if (!e) { toast('没有可以重做的操作'); return; }
  Hist.undo.push({ label: e.label, snap: clone(S), timer: e.timer });
  restoreSnap(e.snap, e.timer); afterHistory();
  toast(`已重做：${e.label}`, { action: '撤销', fn: undo });
}
function afterHistory() { DV++; persist(); render(); syncWake(); }
function undoEntry(e) {
  if (e && Hist.undo[Hist.undo.length - 1] === e) undo();
  else toast('之后又有新的操作了，请用右上角的撤销按钮逐步撤回');
}

/* ---------- 派生统计（按数据版本缓存） ---------- */
const memo = {};
function cached(name, fn) { const m = memo[name]; if (m && m.v === DV) return m.val; const val = fn(); memo[name] = { v: DV, val }; return val; }
const sessionsLive = () => cached('live', () => Object.values(S.sessions).filter(s => !s.del).sort((a, b) => a.start - b.start));
const sessionsTrash = () => Object.values(S.sessions).filter(s => s.del).sort((a, b) => b.del - a.del);
const dayMap = () => cached('days', () => {
  const m = new Map();
  for (const s of sessionsLive()) {
    const k = dayKey(s.start);
    let d = m.get(k);
    if (!d) m.set(k, (d = { total: 0, by: {}, n: 0 }));
    d.total += s.dur; d.n++; d.by[s.courseId] = (d.by[s.courseId] || 0) + s.dur;
  }
  return m;
});
const courseTotals = () => cached('ct', () => { const t = {}; for (const s of sessionsLive()) t[s.courseId] = (t[s.courseId] || 0) + s.dur; return t; });

/* =================== 计时引擎 =================== */
function elapsed(a = S.active, now = Date.now()) {
  if (!a) return 0;
  let t = 0;

  return Math.max(0, t / 1000 + (a.adj || 0));
}
const isRunning = a => !!a && a.segs.length > 0 && a.segs[a.segs.length - 1][1] == null;
function todayLive() {
  const tk = todayKey();
  let v = dayMap().get(tk)?.total || 0;
  if (S.active && dayKey(S.active.startedAt) === tk) v += elapsed();
  return v;
}
function resetAlerts(a) {
  if (!a || a.mode !== 'down' || !a.target) return;
  const el = elapsed(a), T = a.target * 60, wb = (S.settings.warnBefore || 0) * 60;
  if (el < T) a.alerted = false;
  if (el < T - wb) a.warned = false;
}

function startTimer() {
  if (UI.demo) { toast('示例模式下不能计时，请先退出示例'); return; }
  if (S.active) return;
  readDraftInputs();
  const d = UI.draft;
  const c = courseById(d.courseId);
  if (!c || c.archived) { toast('请先选择一门课程'); return; }
  ensureAudio();
  const now = Date.now();
  commit('开始计时', s => {
    s.active = { id: uid('s'), courseId: d.courseId, mode: d.mode, caseType: d.mode === 'down' ? d.caseType : null, target: d.mode === 'down' ? clamp(Math.round(d.target) || 60, 1, 1440) : null, title: (d.title || '').trim(), note: '', startedAt: now, segs: [[now, null]], adj: 0, warned: false, alerted: false };
  }, { timer: true });
  Wake.on();
}
function pauseTimer() {
  const a = S.active; if (!a || !isRunning(a)) return;
  commit('暂停计时', s => { s.active.segs[s.active.segs.length - 1][1] = Date.now(); }, { undoable: false });
  Wake.off();
}
function resumeTimer() {
  const a = S.active; if (!a || isRunning(a)) return;
  ensureAudio();
  commit('继续计时', s => { s.active.segs.push([Date.now(), null]); }, { undoable: false });
  Wake.on();
}
function discardTimer(label) {
  if (!S.active) return;
  const el = elapsed();
  const e = commit(label, s => { s.active = null; }, { timer: true });
  Wake.off();
  toast(`${label === '撤销开始' ? '已撤销开始' : '已放弃本次计时'}（${hms(el)} 没有记录）`, { action: '恢复', fn: () => undoEntry(e) });
}
function adjustBy(sec) {
  const a = S.active; if (!a) return;
  const el = elapsed(a);
  if (el + sec < 0) sec = -Math.floor(el);
  if (!sec) return;
  const m = Math.abs(Math.round(sec / 60));
  const e = commit(sec > 0 ? `计时加 ${m} 分钟` : `计时减 ${m} 分钟`, s => { s.active.adj = (s.active.adj || 0) + sec; resetAlerts(s.active); }, { timer: true });
  toast(`已${sec > 0 ? '加上' : '减去'} ${m} 分钟`, { action: '撤销', fn: () => undoEntry(e) });
}
function openFinish() {
  const a = S.active; if (!a) return;
  const finishAt = Date.now(), el = elapsed(a, finishAt);
  // 校正过的时长（±5 分、从几点开始算）体现在开始时间上，让“开始–结束”与时长一致
  const start = Math.min(finishAt - 1000, Math.round(a.startedAt - (a.adj || 0) * 1000));
  const rec = { id: a.id, courseId: a.courseId, mode: a.mode, caseType: a.caseType, target: a.target, title: a.title || '', note: a.note || '', start, dur: Math.max(1, Math.round(el)), end: finishAt };
  sessionModal(rec, { kind: 'finish', finishAt, short: el < (S.settings.minRecordSec || 0) });
}
function checkAlerts(a, now) {
  if (a.mode !== 'down' || !a.target || !isRunning(a)) return;
  const el = elapsed(a, now), T = a.target * 60, wb = (S.settings.warnBefore || 0) * 60;
  if (!a.alerted && el >= T) {
    commit('目标时间到', s => { s.active.alerted = true; s.active.warned = true; }, { undoable: false, render: false });
    chime();
    notify('目标时间到', `${courseName(a.courseId)} · 目标 ${a.target} 分钟已到，超时部分继续计时`);
    toast(`目标 ${a.target} 分钟到了，现在开始记超时，结束时按“结束并记录”`, { kind: 'over', ms: 9000 });
    const d = $('.dial'); if (d) { d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash'); }
  } else if (!a.warned && wb > 0 && T > wb && el >= T - wb && el < T) {
    commit('提醒', s => { s.active.warned = true; }, { undoable: false, render: false });
    beep();
    toast(`距离目标还剩 ${S.settings.warnBefore} 分钟`, { ms: 5000 });

let AC = null;

}
function tone(f, t0, dur, gain) {

  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + 0.02);

}

/* =================== 云端同步（Artifact db 能力；不可用时用本机存储） =================== */
let syncState = 'local';
function setSync(s) { syncState = s; renderSync(); }
const Cloud = {
  db: null, base: {}, queue: new Map(), inflight: null, flushing: false, unsub: [], dirty: false, retryTm: null,
  async init() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { setSync('local'); return; }
    setSync('connecting');
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use('db'), c.use('user').catch(() => null)]); } catch (e) { db = null; }
    if (!db) { setSync('local'); return; }
    let can = null;
    try { can = user ? await user.can('data.write') : null; } catch (e) { can = null; }
    if (can === false) { setSync('readonly'); return; }
    this.db = db;
    try {
      const [meta, act, months] = await Promise.all([db.doc('app/meta').get(), db.doc('app/active').get(), db.collection('months').get()]);
      if (!meta.exists) {
        Store.mode = 'cloud';
        this.sync();
      } else {
        const local = realState();
        const localHas = Object.keys(local.sessions).length > 0 && Store.localSrc !== 'cloud';
        if (localHas) { try { localStorage.setItem(LSKEY + '-local-backup', JSON.stringify(local)); } catch (e) {} }
        const remote = migrate({ ...meta.data(), active: act.exists ? act.data().active : null, sessions: [] });
        this.base = { 'app/meta': stable(meta.data()) };
        if (act.exists) this.base['app/active'] = stable(act.data());
        for (const doc of months.docs) {
          const data = doc.data() || {};
          this.base['months/' + doc.id] = stable(data);
          for (const s of Object.values(data.items || {})) if (s && s.id) remote.sessions[s.id] = clone(s);
        }
        Object.assign(remote, migrate(remote));
        if (UI.demo) Store.realS = remote; else S = remote;
        DV++; Store.mode = 'cloud'; Store.saveLocal(); applyTheme();
        if (localHas) toast('已载入云端数据。这台设备上原来的数据另存了一份，可在 设置 › 数据 里导出或合并', { ms: 10000 });
      }
      this.subscribe();
      if (!this.flushing) setSync('synced');
      render(); syncWake();
    } catch (e) {
      Store.mode = 'local'; this.db = null;
      setSync(e && e.code === 'invalid_argument' ? 'readonly' : 'error');
    }
  },
  subscribe() {
    const db = this.db;
    const onErr = e => { if (e && e.code === 'revoked') this.fallback('云端访问已被收回，之后的数据先保存在本机'); else setSync('error'); };
    this.unsub.push(db.doc('app/meta').onSnapshot(s => { this.remote('app/meta', s.exists ? s.data() : null); this.after(); }, onErr));
    this.unsub.push(db.doc('app/active').onSnapshot(s => { this.remote('app/active', s.exists ? s.data() : null); this.after(); }, onErr));
    this.unsub.push(db.collection('months').onSnapshot(q => { for (const ch of q.docChanges()) this.remote('months/' + ch.doc.id, ch.type === 'removed' ? { items: {} } : ch.doc.data()); this.after(); }, onErr));
  },
  remote(path, data) {
    if (!data || this.queue.has(path) || this.inflight === path) return;
    const j = stable(data);
    if (this.base[path] === j) return;
    this.base[path] = j;
    const T = realState();
    if (path === 'app/meta') {
      const m = migrate({ ...data, sessions: [] });
      T.settings = m.settings; T.courses = m.courses; T.caseTypes = m.caseTypes; T.countdowns = m.countdowns; T.notes = m.notes; T.pinned = m.pinned;
      applyTheme();
    } else if (path === 'app/active') {
      T.active = clone(data.active ?? null);
      syncWake();
    } else if (path.startsWith('months/')) {
      const mk = path.slice(7);
      for (const [id, s] of Object.entries(T.sessions)) if (monthKey(s.start) === mk) delete T.sessions[id];
      for (const s of Object.values(data.items || {})) if (s && s.id) T.sessions[s.id] = clone(s);
    }
    this.dirty = true;
  },
  after() { if (!this.dirty) return; this.dirty = false; DV++; Store.saveLocal(); scheduleRender(); },
  docsFor(T) {
    const out = {
      'app/meta': { schema: 1, settings: T.settings, courses: T.courses, caseTypes: T.caseTypes, countdowns: T.countdowns, notes: T.notes, pinned: T.pinned ?? null },
      'app/active': { active: T.active ?? null }
    };
    const months = {};
    for (const s of Object.values(T.sessions)) (months[monthKey(s.start)] = months[monthKey(s.start)] || {})[s.id] = s;
    for (const mk in months) out['months/' + mk] = { items: months[mk] };
    for (const p in this.base) if (p.startsWith('months/') && !out[p]) out[p] = { items: {} };
    return out;
  },
  sync() {
    if (!this.db || Store.mode !== 'cloud') return;
    const docs = this.docsFor(realState());
    for (const p in docs) {
      const j = stable(docs[p]);
      if (this.base[p] !== j) { this.base[p] = j; this.queue.set(p, JSON.parse(j)); }
    }
    this.flush();
  },
  async flush() {
    if (this.flushing || !this.queue.size) return;
    this.flushing = true; setSync('syncing');
    let ok = true;
    while (this.queue.size && this.db) {
      const [p, d] = this.queue.entries().next().value;
      this.queue.delete(p); this.inflight = p;
      try { await this.write(p, d); }
      catch (e) { ok = false; this.inflight = null; this.onFail(e, p); break; }
      this.inflight = null;
    }
    this.flushing = false;
    if (Store.mode === 'cloud') setSync(ok ? 'synced' : 'error');
  },
  async write(p, d) {
    try { await this.db.doc(p).set(d); }
    catch (e) { if (e && e.code === 'unavailable') { await sleep(600 + Math.random() * 900); await this.db.doc(p).set(d); } else throw e; }
  },
  onFail(e, p) {
    const code = e && e.code;
    if (['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed', 'quota_exceeded'].includes(code)) {
      this.fallback(code === 'quota_exceeded' ? '云端空间已满，之后的数据先保存在本机，请导出备份' : '没有云端写入权限，之后的数据先保存在本机浏览器');
      return;
    }
    delete this.base[p];
    for (const q of this.queue.keys()) delete this.base[q];
    this.queue.clear();
    clearTimeout(this.retryTm);
    this.retryTm = setTimeout(() => this.sync(), 5000);
  },
  fallback(msg) {
    this.unsub.forEach(u => { try { u(); } catch (e) {} });
    this.unsub = []; this.queue.clear(); this.db = null;
    Store.mode = 'local'; Store.saveLocal(); setSync('readonly');
    toast(msg, { ms: 9000 });
  }
};

let lastFrac = 0;
function updateDial(a, now) {
  const prog = $('#ring-prog'); if (!prog) return;
  const over = $('#ring-over'), card = $('#timer-card');
  let frac = 0, ofrac = 0, label, digits, sub = '', state = 'idle';
  if (!a) {
    const d = UI.draft;
    if (d.mode === 'down') { label = '目标'; digits = hms((d.target || 0) * 60); sub = d.caseType ? `${d.caseType} 分钟 case · 超时后自动续计` : '超时后自动续计'; }
    else { label = '准备开始'; digits = hms(0); sub = '正计时 · 可随时暂停'; }
  } else {
    const el = elapsed(a, now), run = isRunning(a);
    state = run ? 'running' : 'paused';
    if (a.mode === 'down' && a.target) {
      const T = a.target * 60;
      if (el < T) {
        label = run ? '剩余' : '已暂停 · 剩余'; digits = hms(Math.ceil(T - el)); frac = el / T; sub = `已用 ${hms(el)} · 目标 ${a.target} 分`;
        if (S.settings.warnBefore > 0 && T - el <= S.settings.warnBefore * 60) state += ' warn';
      } else {
        const ov = Math.floor(el - T);
        label = run ? '超时 · 仍在计时' : '已暂停 · 超时'; digits = '+' + (ov < 3600 ? `${Math.floor(ov / 60)}:${pad(ov % 60)}` : hms(ov)); frac = 1; ofrac = Math.min(1, (el - T) / T); sub = `总用时 ${hms(el)} · 目标 ${a.target} 分`; state += ' over';
      }
    } else {
      label = run ? '已学习' : '已暂停'; digits = hms(el); frac = (el % 3600) / 3600;
      sub = `第 ${Math.floor(el / 3600) + 1} 个小时 · 每圈 60 分钟`;
    }
  }
  prog.style.transition = frac < lastFrac - 0.001 ? 'none' : '';
  lastFrac = frac;
  prog.style.strokeDashoffset = (C1 * (1 - frac)).toFixed(2);
  prog.style.opacity = frac > 0.0005 ? 1 : 0;
  over.style.strokeDashoffset = (C2 * (1 - ofrac)).toFixed(2);
  over.style.opacity = ofrac > 0 ? 1 : 0;
  $('#rd-label').textContent = label;
  const dg = $('#rd-digits');
  dg.textContent = digits;
  dg.style.fontSize = digits.length > 7 ? 'clamp(30px,8.4vw,47px)' : '';
  $('#rd-sub').textContent = sub;
  if (card.dataset.state !== state) {
    card.dataset.state = state;
    const st = $('#state-txt');
    if (st) st.textContent = state.includes('over') ? '超时中' : state.includes('paused') ? '已暂停' : '计时中';
  }
  const g = $('#grace');
  if (g && a) {
    const left = (S.settings.graceSec || 0) - (now - a.startedAt) / 1000;
    g.hidden = !(left > 0);
    if (left > 0) $('#grace-left').textContent = `${Math.ceil(left)} 秒后隐藏`;
  }
}

}
function caseSection() {
  const all = sessionsLive().filter(s => s.mode === 'down' && s.caseType);
  const filt = s => UI.caseCourse === 'all' || s.courseId === UI.caseCourse;
  const types = [...new Set([...S.caseTypes, ...all.map(s => s.caseType)])].sort((a, b) => a - b);
  const counts = {}; for (const t of types) counts[t] = all.filter(s => s.caseType === t && filt(s)).length;
  let sel = UI.caseSel;
  if (!types.includes(sel) || !counts[sel]) sel = types.find(t => counts[t]) ?? types[0];
  UI.caseSel = sel;
  const pts = all.filter(s => s.caseType === sel && filt(s));
  const courseSel = `<select class="input sm" data-ui="caseCourse" aria-label="按课程筛选"><option value="all">全部课程</option>${S.courses.map(c => `<option value="${c.id}" ${UI.caseCourse === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  let inner;
  if (!types.length) inner = `<div class="empty-sm">还没有 case 类型，可以在设置里添加。</div>`;
  else if (!pts.length) inner = `<div class="empty-sm">还没有 ${sel} 分钟 case 的记录。在计时页选“Case 练习”，再选 ${sel} 分就会记到这一组。</div>`;
  else {
    const ys = pts.map(s => s.dur / 60);
    const last3 = ys.slice(-3), avg3 = last3.reduce((a, b) => a + b, 0) / last3.length;
    const withT = pts.filter(s => s.target), met = withT.filter(s => s.dur / 60 <= s.target + 0.5).length;
    const imp = ys.length > 1 ? Math.round((1 - avg3 / ys[0]) * 100) : null;
    inner = `<div class="case-sum">
        <div><span>练习次数</span><b>${pts.length}<small>次</small></b></div>
        <div><span>第一次</span><b>${Math.round(ys[0])}<small>分</small></b></div>
        <div><span>最近一次</span><b>${Math.round(ys[ys.length - 1])}<small>分</small></b></div>
        <div><span>最快</span><b>${Math.round(Math.min(...ys))}<small>分</small></b></div>
        <div><span>最近 ${last3.length} 次平均</span><b>${Math.round(avg3)}<small>分</small></b></div>
        <div><span>对比第一次</span><b class="${imp > 0 ? 'good-t' : ''}">${imp == null ? '—' : imp > 0 ? `快 ${imp}%` : imp < 0 ? `慢 ${-imp}%` : '持平'}</b></div>
        <div><span>达到目标</span><b>${withT.length ? `${met}/${withT.length}` : '—'}</b></div>
      </div>
      <div class="legend">
        <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="22" y2="5" style="stroke:var(--accent);stroke-width:2.2"/><circle cx="11" cy="5" r="3.6" style="fill:var(--accent)"/></svg>实际用时（实心 = 达到目标）</span>
        <span><svg viewBox="0 0 22 10"><circle cx="11" cy="5" r="3.6" style="fill:var(--surface);stroke:var(--red);stroke-width:2"/></svg>超过目标（空心）</span>
        <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="22" y2="5" style="stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:1.5 4;stroke-linecap:round"/></svg>我的目标</span>
        <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="22" y2="5" style="stroke:var(--muted);stroke-width:1.3;stroke-dasharray:7 5"/></svg>Case 建议时长 ${sel} 分</span>
      </div>
      <div class="chart" id="case-chart"></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>日期</th><th>名称</th><th>课程</th><th class="r">目标</th><th class="r">实际</th><th class="r">对比目标</th><th></th></tr></thead><tbody>
        ${pts.map((s, i) => ({ s, i })).reverse().map(({ s, i }) => { const d = s.target ? Math.round(s.dur / 60) - s.target : null; return `<tr><td class="num">${i + 1}</td><td class="num">${md(dayKey(s.start))}</td><td>${esc(s.title || '—')}</td><td><i class="dot" style="--c:${cvar(s.courseId)}"></i> ${esc(courseName(s.courseId))}</td><td class="r num">${s.target ? s.target + ' 分' : '—'}</td><td class="r num"><b>${Math.round(s.dur / 60)} 分</b></td><td class="r">${d == null ? '—' : d > 0 ? `<span class="delta over">+${d}</span>` : `<span class="delta ok">${d === 0 ? '±0' : MINUS + -d}</span>`}</td><td class="r"><button class="btn icon sm ghost" data-act="edit-session" data-id="${s.id}" aria-label="编辑">${icon('edit')}</button></td></tr>`; }).join('')}
      </tbody></table></div>`;
  }
  return `<section class="panel" id="case-panel">
    <div class="panel-h"><div><h3>Case 进步曲线</h3><p class="muted">同一类 case 每次实际花了多久。60 分钟的 case 写了 180 分钟，也还是记在 60 分钟这一组。</p></div>${courseSel}</div>
    <div class="sheet">
      <div class="ctabs" role="tablist">${types.map(t => `<button role="tab" aria-selected="${t === sel}" data-act="case-sel" data-v="${t}">${t} 分钟<span class="cnt">${counts[t]}</span></button>`).join('')}</div>
      ${inner}
    </div>
  </section>`;
}

/* =================== 视图：打卡 =================== */
function stampHTML(k, anim) { const d = keyDate(k); return `<div class="stamp${anim ? ' anim' : ''}" role="img" aria-label="今日已打卡"><span class="s1">已打卡</span><span class="s2">${d.getFullYear()}·${pad(d.getMonth() + 1)}·${pad(d.getDate())}</span></div>`; }
function viewCheckin() {
  const tk = todayKey(), st = streaks(), live = todayLive(), savedSec = dayMap().get(tk)?.total || 0;
  const goal = S.settings.dailyGoal * 60, thr = S.settings.checkinMin * 60;
  const ym = UI.calMonth || tk.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const first = toKey(new Date(y, m - 1, 1)), dim = new Date(y, m, 0).getDate();
  let mDays = 0, mTotal = 0;
  for (let i = 0; i < dim; i++) { const k = addDays(first, i), d = dayMap().get(k); if (d) mTotal += d.total; if (checkedDay(k)) mDays++; }
  const off = (keyDate(first).getDay() + 6) % 7, cells = Math.ceil((off + dim) / 7) * 7;
  let cal = ['一', '二', '三', '四', '五', '六', '日'].map(w => `<div class="dow">${w}</div>`).join('');
  for (let i = 0; i < cells; i++) {
    const k = addDays(first, i - off), d = dayMap().get(k), v = d?.total || 0;
    const lv = v <= 0 ? 0 : v < goal * 0.25 ? 1 : v < goal * 0.5 ? 2 : v < goal ? 3 : 4;
    const out = k.slice(0, 7) !== ym, fut = k > tk;
    cal += `<button class="day lv${lv}${out ? ' out' : ''}${fut ? ' future' : ''}${k === tk ? ' today' : ''}" ${fut ? 'disabled' : `data-act="day" data-k="${k}"`} aria-label="${md(k)} ${v ? hm(v) : '无记录'}${checkedDay(k) ? ' 已打卡' : ''}">
      <span class="n">${keyDate(k).getDate()}</span>${v ? `<span class="h">${v < 3600 ? Math.round(v / 60) + '<i>m</i>' : (v / 3600).toFixed(1) + '<i>h</i>'}</span>` : ''}${checkedDay(k) ? '<span class="mk" aria-hidden="true">✓</span>' : ''}</button>`;
  }
  return viewHead('每日打卡', `一天学满 ${hmText(thr)} 自动打卡，学习日从凌晨 ${S.settings.dayStartHour} 点开始算。门槛和目标都可以在设置里改。`)
    + `<div class="ck-top">
      <section class="card ck-today">
        <div>
          <div class="eyebrow">今天 · ${mdw(tk)}</div>
          <div class="ck-big num">${hmRich(live)}</div>
          <div class="goalbar"><i style="width:${pct(live, goal)}%"></i></div>
          <div class="goal-meta"><span>每日目标 ${hm(goal)}</span><span>${live >= goal ? '<span class="ok-txt">已达成</span>' : `还差 ${hm(goal - live)}`}</span></div>
          ${S.active ? `<p class="live-note"><span class="state-dot"></span>含正在进行的计时，结束记录后才计入打卡</p>` : ''}
        </div>
        ${st.todayDone ? stampHTML(tk, UI.stampAnim) : `<div class="stamp empty"><span class="s1">未打卡</span><span class="s2">还差 ${hm(Math.max(0, thr - savedSec))}</span></div>`}
      </section>
      <section class="card ck-stats">
        <div><span>当前连续</span><b>${st.cur}<small>天</small></b></div>
        <div><span>最长连续</span><b>${st.best}<small>天</small></b></div>
        <div><span>${m}月打卡</span><b>${mDays}<small>天</small></b></div>
        <div><span>${m}月合计</span><b>${hours1(mTotal)}<small>小时</small></b></div>
      </section>
    </div>
    <section class="panel">
      <div class="sheet">
        <div class="cal-h"><button class="btn icon sm" data-act="cal-move" data-v="-1" aria-label="上个月">${icon('chevL')}</button><h4>${y}年${m}月</h4><button class="btn icon sm" data-act="cal-move" data-v="1" aria-label="下个月">${icon('chevR')}</button>${ym !== tk.slice(0, 7) ? `<button class="btn sm ghost" data-act="cal-move" data-v="0">回到本月</button>` : ''}<span class="sum">点某一天可以查看、补录或写小结</span></div>

function deltaTag(s) {
  if (!s.target) return '';
  const d = Math.round(s.dur / 60) - s.target;
  return d > 0 ? `<span class="delta over" title="比目标多 ${d} 分钟">+${d}</span>` : `<span class="delta ok" title="在目标之内">${d === 0 ? '±0' : MINUS + -d}</span>`;
}
function rowHTML(s) {

    ? `<span class="ktag case">Case${s.caseType ? ' ' + s.caseType : ''}${s.target ? ` · 目标 ${s.target}` : ''}</span>${deltaTag(s)}`
    : '';
  return `<div class="lg-row">
    <span class="t num">${hhmm(s.start)}–${hhmm(s.end)}</span>
    <span class="c"><i class="dot" style="--c:${cvar(s.courseId)}"></i><span>${esc(courseName(s.courseId))}</span></span>
    <span class="k">${kind}${s.src === 'manual' ? '<span class="ktag">补录</span>' : ''}${s.title ? `<span class="ttl">${esc(s.title)}</span>` : ''}${s.note ? `<span class="nt">${esc(s.note)}</span>` : ''}</span>
    <span class="du num">${hm(s.dur)}</span>
    <span class="a"><button class="btn icon sm ghost" data-act="edit-session" data-id="${s.id}" aria-label="编辑">${icon('edit')}</button><button class="btn icon sm ghost" data-act="del-session" data-id="${s.id}" aria-label="删除">${icon('trash')}</button></span>
  </div>`;
}
function viewRecords() {
  const f = UI.rec, tk = todayKey();
  let list = sessionsLive();
  if (f.course !== 'all') list = list.filter(s => s.courseId === f.course);
  if (f.kind === 'case') list = list.filter(s => s.mode === 'down');
  else if (f.kind === 'free') list = list.filter(s => s.mode !== 'down');
  else if (f.kind === 'manual') list = list.filter(s => s.src === 'manual');
  if (f.range !== 'all') { const from = addDays(tk, -(+f.range - 1)); list = list.filter(s => dayKey(s.start) >= from); }

  for (const s of list) { const k = dayKey(s.start); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); }
  const keys = [...groups.keys()].sort().reverse();
